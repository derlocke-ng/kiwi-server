name: ci
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q shellcheck xorriso cpio python3-yaml python3-jinja2 docker-compose-v2 age python3-fastapi python3-uvicorn python3-multipart qrencode
          # out of the project's own image: GitHub's release downloads kept answering 504
          docker create --name butane quay.io/coreos/butane:release
          sudo docker cp butane:/usr/local/bin/butane /usr/local/bin/butane
          docker rm butane
      - name: shellcheck
        run: |
          shellcheck -S warning bin/kiwi-server install.sh data/bash-completion/kiwi-server \
            tests/cli.sh tools/vendor.sh
          shellcheck -S warning -s bash roles/common/lib.sh roles/common/kiwi-stack roles/*/apply.sh tests/check-version.sh
      - name: python compiles
        run: python3 -m py_compile gui/kiwi-server-gui lib/kiwiserver/*.py lib/kiwiserver/targets/*.py lib/kiwimodules/*.py tests/*.py
      - name: version agrees everywhere
        run: bash tests/check-version.sh
      - name: the tree carries the pinned kiwi-modules and kiwi-stack releases
        run: bash tools/vendor.sh --check
      - name: unit tests (rendered scripts are shellchecked, Butane validated, Debian ISO rebuilt on a mock)
        run: python3 -m unittest discover -s tests -v
      - name: cli smoke test
        run: bash tests/cli.sh
