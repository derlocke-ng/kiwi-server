schema_version: "1.0"

module:
  name: downloader
  title: Download station
  version: 1.1.0
  description: "Transmission and JDownloader inside the VPN client's network namespace — no tunnel, no traffic — with their web UIs behind the reverse proxy"
  category: storage
  node_types: [node]

dependencies:
  required: [vpn-client]
  optional: [reverse-proxy]

network:
  needs_vpn_dnat: true
  open_ports: []

firewall:
  scope: vpn-client
  rules: []

templates:
  compose: docker-compose.yml.j2

storage:
  bind_mounts:
    - { host: "${DOCKERDIR}/{{ container_prefix }}-transmission", type: dir, required: true }
    - { host: "${DOCKERDIR}/{{ container_prefix }}-jdownloader", type: dir, required: true }
    - { host: "{{ download_dir }}", type: dir, required: true }

urls:
  - "Transmission: https://{{ transmission_hostname or 'dl.' ~ hostname }}"
  - "JDownloader: https://{{ jd_hostname or 'jd.' ~ hostname }}"

nginx:
  servers:
    - server_name: "{{ transmission_hostname or 'dl.' ~ hostname }}"
      proxy_pass: "http://{{ container_prefix }}-vpn-client:9091"
      comment: Transmission (reached through the VPN client's namespace)
    - server_name: "{{ jd_hostname or 'jd.' ~ hostname }}"
      proxy_pass: "https://{{ container_prefix }}-vpn-client:5800"
      websocket: true
      when: jdownloader
      comment: JDownloader (its own TLS, self-signed, behind the login)

settings:
  - key: download_dir
    required: true
    label: Download directory
    help: Absolute path on the host, e.g. /mnt/data/downloads.
    placeholder: /mnt/data/downloads
  - key: transmission_user
    help: "The login of Transmission's web UI, and of JDownloader's unless jd_web_user is set."
    default: user
  - key: transmission_password
    type: secret
    generate: true
    help: "Empty: generated from the fleet's seed."
  - key: transmission_hostname
    label: Transmission hostname
    help: "Empty: dl.<hostname>."
    default: ""
  - key: jdownloader
    type: bool
    label: Run JDownloader
    help: "JDownloader 2 next to Transmission, for downloads from file hosters, at jd.<hostname>. Off: Transmission only."
    default: true
  - key: jd_hostname
    label: JDownloader hostname
    help: "Empty: jd.<hostname>."
    default: ""
  - key: jd_web_user
    label: JDownloader web login
    help: "Empty: the Transmission user."
    default: ""
  - key: jd_web_password
    type: secret
    label: JDownloader web password
    help: "The web UI always asks for a login. Empty: the Transmission password."
    default: ""
  - key: myjd_email
    label: MyJDownloader account
    help: Optional remote control through my.jdownloader.org.
    default: ""
  - key: myjd_password
    type: secret
    help: "The password of the MyJDownloader account. Only used together with that account."
    default: ""
  - key: myjd_device_name
    help: "The name this JDownloader appears under at my.jdownloader.org. Empty: the hostname."
    default: ""
  - key: puid
    type: int
    help: "The user ID Transmission and JDownloader run as and write the downloads with, e.g. 1000, the first user on most systems. The download directory must belong to it."
    default: 1000
  - key: pgid
    type: int
    help: "The group ID that goes with puid."
    default: 1000
  - key: extra_env
    type: map
    group: Advanced
    label: Extra Transmission environment variables
    help: "KEY=value, passed to the Transmission container as they are, e.g. PEERPORT=51413."
    default: {}
  - key: jd_extra_env
    type: map
    group: Advanced
    label: Extra JDownloader environment variables
    help: "KEY=value, passed to the JDownloader container as they are, e.g. DARK_MODE=1."
    default: {}
  - key: transmission_image
    group: Advanced
    help: "The container image of Transmission, pinned by tag. Change it to try another version or to pin a newer one. The default, latest, follows each new release."
    default: lscr.io/linuxserver/transmission:latest
  - key: jdownloader_image
    group: Advanced
    help: "The container image of JDownloader, pinned by tag. Change it to try another version or to pin a newer one. The default, latest, follows each new release."
    default: docker.io/jlesage/jdownloader-2:latest
