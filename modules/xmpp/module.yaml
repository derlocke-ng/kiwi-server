schema_version: "1.0"

module:
  name: xmpp
  title: Jabber
  version: 2.0.2
  description: "A Jabber (XMPP) server for your people: chats, group rooms, files, message history across devices. One service with up to three doors: the VPN (jabber.<hostname>), the Internet (a public name) and Tor (a hidden service). Or two separate ones, an internal and a public, that do not talk to each other. People make their own account in the app or on a page, after a captcha. It runs on a node or on the master; a node's public name comes in through the master"
  category: productivity
  node_types: [master, node]

dependencies:
  # it shares the network of the machine's door to the VPN (the VPN client on a node, the
  # WireGuard server on a master): clients on the VPN reach it at the machine's mesh address
  required: [reverse-proxy]
  optional: [vpn-server, vpn-client, onion]

network:
  needs_vpn_dnat: true
  # on a master, clients (5222, 5223) and other servers (5269) from the Internet: only with a
  # public name. A node opens nothing at home: the master hands them on (expose, below)
  open_ports: ["{% if xmpp_domain and node_type == 'master' %}5222/tcp 5223/tcp 5269/tcp{% endif %}"]

# a node's public name: the master's ports, handed on to ports that expect the visitor's address in front
expose:
  ports:
    - "{% if xmpp_domain and node_type != 'master' %}5222:15222/proxy 5223:15223/proxy 5269:15269/proxy{% endif %}"

firewall:
  scope: vpn-client
  rules:
    # a node: the service is in the VPN client's network. Apps on the VPN reach it at the mesh address
    - "{% if node_type != 'master' %}-A INPUT -i tun0 -p tcp -m multiport --dports 5222,5223 -j ACCEPT{% endif %}"
    # and what the master hands on from the Internet, from the master only
    - "{% if forwarded and not two %}-A INPUT -i tun0 -s {{ via }} -p tcp -m multiport --dports 15222,15223,15269 -j ACCEPT{% endif %}"
    # two instances: the public one has an address of its own
    - |
      {% if forwarded and two %}{% for port in (15222, 15223, 15269) %}
      -t nat -A PREROUTING -s {{ via }} -d {{ vpn_ip }} -p tcp --dport {{ port }} -j DNAT --to-destination {{ container_ip }}:{{ port }}
      {% endfor %}{% endif %}

templates:
  compose: docker-compose.yml.j2
  config: ejabberd.yml.j2
  config_public: ejabberd.yml.j2
  start: start.sh.j2
  terms: terms.txt.j2

outputs:
  config: { path: "{{ container_prefix }}-xmpp/ejabberd.yml", mode: 0644 }
  config_public: { path: "{{ container_prefix }}-xmpp/ejabberd-public.yml", mode: 0644, when: two }
  terms: { path: "{{ container_prefix }}-xmpp/join/terms.txt", mode: 0644, when: join_on }
  start: { path: "{{ container_prefix }}-xmpp/start.sh", mode: 0755 }

derived:
  internal_host: "{{ xmpp_hostname or 'jabber.' ~ hostname }}"
  # two instances: an internal one at the mesh name, a public one at the public name
  two: "{{ 'yes' if xmpp_domain and separate else '' }}"
  one_public: "{{ 'yes' if xmpp_domain and not separate else '' }}"
  # what comes after the @ at the service in the machine's VPN network
  main_host: "{{ xmpp_domain if xmpp_domain and not separate else xmpp_hostname or 'jabber.' ~ hostname }}"
  # whose network the service shares: the machine's door to the VPN
  door: "{{ 'vpn-server' if node_type == 'master' else 'vpn-client' }}"
  # the sign-up page, the one page for new accounts whatever way is on: a small container of its
  # own (kiwi-server signup). ejabberd's own /register page is not used
  join_on: "yes"
  join_ways: "{{ ((['invites'] if invites else []) + (['requests'] if requests else []) + (['captcha'] if registration else [])) | join(',') }}"
  # the proxy reaches that service at 127.0.0.1 when it shares the network too (a master's does)
  local_http: "{{ '127.0.0.1' if module_config.get('reverse-proxy', {}).get('network_mode') == 'vpn-server' else container_prefix ~ ('-vpn-server' if node_type == 'master' else '-vpn-client') }}:5280"
  # on a node the public name's connections come from the master, each with its visitor's address in front
  forwarded: "{{ 'yes' if xmpp_domain and node_type != 'master' and via else '' }}"

validate:
  - when: "admins | reject('match', '^[a-z0-9][a-z0-9._-]{0,30}$') | list"
    error: "xmpp.admins: names before the @, lowercase letters, digits, dots and dashes"
  - when: "not admin_user is match('^[a-z0-9][a-z0-9._-]{0,30}$')"
    error: "xmpp.admin_user: lowercase letters, digits, dots and dashes"
  - when: "xmpp_domain and (xmpp_domain ~ '.').endswith('.' ~ domain ~ '.')"
    error: "xmpp.xmpp_domain is for a public name (chat.example.org). Inside the fleet's own domain the name is xmpp_hostname"
  - when: "node_type == 'master' and not has_vpn_server"
    error: "xmpp on a master needs vpn-server: the service lives in its network"
  - when: "node_type != 'master' and not has_vpn_client"
    error: "xmpp on a node needs vpn-client: the service lives in its network and answers at the machine's VPN address"
  - when: "xmpp_domain and node_type != 'master' and not via"
    error: "xmpp.xmpp_domain on a node: the public name comes in through the master, so the machine's proxy must be open to the internet (reverse-proxy: public: true) in a fleet with a master"
  - when: "separate and not xmpp_domain"
    error: "xmpp.separate: two instances need a public name for the second one (xmpp_domain)"

storage:
  bind_mounts:
    - { host: "${DOCKERDIR}/{{ container_prefix }}-xmpp/join", type: dir, required: true, when: join_on }
    # one folder per name under hosts/: start.sh makes it (from an older layout's data/ or public/)
    - { host: "${DOCKERDIR}/{{ container_prefix }}-xmpp/hosts", type: dir, required: true }

urls:
  - "Jabber: {{ admin_user }}@{{ main_host }} in any XMPP app (Conversations, Monal, Dino, Gajim); from the VPN the server is {{ internal_host }}{% if xmpp_domain and not separate %}, from the Internet {{ xmpp_domain }}{% endif %}; new accounts: https://{{ internal_host }}/join; its admin panel (from the VPN): https://{{ internal_host }}/admin"
  - "{% if two %}Jabber, the public one: {{ admin_user }}@{{ xmpp_domain }}; new accounts: https://{{ xmpp_domain }}/join{% endif %}"

logins:
  - label: Jabber
    site: jabber
    user: "{{ admin_user }}@{{ main_host }}"
    password: admin_password
    note: "The admin's account, in a Jabber app or on the admin panel at /admin (from the VPN). Every start sets this password again. Other people make their own account on the page /join, in the ways switched on."

# its page on the VPN (jabber.<hostname>); the Internet's door is its own public name
pages:
  jabber: {label: Jabber, about: "Chat with anyone on Jabber (XMPP)", public: xmpp_domain}

nginx:
  servers:
    # the page of the service on the VPN: new accounts (/register), files, chat for web apps
    - server_name: "{{ internal_host }}"
      # usable as a hidden service: the page for new accounts and logins on 5222 were tried through Tor
      onion: true
      site: jabber
      # on a node its ports are at the machine's VPN address only: at home the name leads there too
      mesh_only: "{{ 'yes' if node_type != 'master' else '' }}"
      proxy_pass: "http://{{ local_http }}"
      websocket: true
      client_max_body_size: "{{ upload_mb }}m"
      proxy_read_timeout: 3600s
      extra_locations:
        # the page's front door: where a new account is made
        - { path: "= /", config: "return 302 /join;" }
        # ejabberd's own sign-up page: the one page is /join
        - { path: "^~ /register", config: "return 302 /join;" }
        # ejabberd's admin panel: from the VPN only, never from the internet or Tor
        - { path: "^~ /admin", admin: true, proxy: true, config: "allow {{ mesh_subnet }}; deny all;" }
        # the sign-up page: invite codes, requests, and the open way with a picture test (kiwi-server signup)
        - path: "/join"
          config: >-
            set $join http://{{ container_prefix }}-xmpp-join:8080;
            proxy_pass $join;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
      comment: Jabber (new accounts, files, chat for web apps)
    # the same service under its public name
    - server_name: "{{ xmpp_domain }}"
      # usable as a hidden service: the page for new accounts and logins on 5222 were tried through Tor
      onion: true
      site: xmpp
      mesh_only: "{{ 'yes' if node_type != 'master' else '' }}"
      proxy_pass: "http://{{ local_http }}"
      websocket: true
      client_max_body_size: "{{ upload_mb }}m"
      proxy_read_timeout: 3600s
      extra_locations:
        # the page's front door: where a new account is made
        - { path: "= /", config: "return 302 /join;" }
        # ejabberd's own sign-up page: the one page is /join
        - { path: "^~ /register", config: "return 302 /join;" }
        # ejabberd's admin panel: from the VPN only, never from the internet or Tor
        - { path: "^~ /admin", admin: true, proxy: true, config: "allow {{ mesh_subnet }}; deny all;" }
        # the sign-up page: invite codes, requests, and the open way with a picture test (kiwi-server signup)
        - path: "/join"
          config: >-
            set $join http://{{ container_prefix }}-xmpp-join:8080;
            proxy_pass $join;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
      when: one_public
      comment: Jabber under its public name
    # two instances: the public one has a container of its own
    - server_name: "{{ xmpp_domain }}"
      # usable as a hidden service: the page for new accounts and logins on 5222 were tried through Tor
      onion: true
      site: xmpp
      mesh_only: "{{ 'yes' if node_type != 'master' else '' }}"
      proxy_pass: "http://{{ container_prefix }}-xmpp-public:5280"
      websocket: true
      client_max_body_size: "{{ upload_mb }}m"
      proxy_read_timeout: 3600s
      extra_locations:
        # the page's front door: where a new account is made
        - { path: "= /", config: "return 302 /join;" }
        # ejabberd's own sign-up page: the one page is /join
        - { path: "^~ /register", config: "return 302 /join;" }
        # ejabberd's admin panel: from the VPN only, never from the internet or Tor
        - { path: "^~ /admin", admin: true, proxy: true, config: "allow {{ mesh_subnet }}; deny all;" }
        # the sign-up page: invite codes, requests, and the open way with a picture test (kiwi-server signup)
        - path: "/join"
          config: >-
            set $join http://{{ container_prefix }}-xmpp-join:8080;
            proxy_pass $join;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
      when: two
      comment: Jabber, the public instance

backup:
  frozen:
    containers: ["{{ container_prefix }}-xmpp", "{% if two %}{{ container_prefix }}-xmpp-public{% endif %}"]
    paths: ["${DOCKERDIR}/{{ container_prefix }}-xmpp/hosts"]

settings:
  - key: image
    group: Advanced
    label: Image
    help: "ejabberd with what its captcha needs (ImageMagick, fonts), built by this project from ejabberd's own image."
    default: ghcr.io/derlocke-ng/ejabberd:26.09-kiwi1
  - key: xmpp_hostname
    label: Name on the VPN
    help: "Empty: jabber.<hostname>. What apps on the VPN connect to, and, without a public name, what comes after the @."
    default: ""
    pattern: '[a-z0-9.-]*'
  - key: xmpp_domain
    label: Public name
    help: "A name that points at the master in DNS, like chat.example.org (a plain record: no proxy in front, Jabber is not web traffic). It opens the service to the Internet: this name comes after the @, people log in from anywhere and write with people on other servers. Apps on the VPN can still use the name above as the server to connect to."
    default: ""
    pattern: '[a-z0-9.-]*'
  - key: invites
    type: bool
    label: Invite codes
    help: "On the page https://<name>/join someone with an invite code makes their own address and password. The codes are made on the control page (Accounts, Jabber) or with kiwi-server accounts <fleet> --jabber invite."
    default: true
  - key: requests
    type: bool
    label: Requests
    help: "On the same page people ask for an address with a few words; you accept or deny on the control page. Accepted: they get a password, shown once with their request code."
    default: true
  - key: terms
    type: text
    label: The rules
    help: "What the sign-up page says the rules are, a paragraph a line. Empty: no spam, no malware, no harassment, nothing against the law."
    default: ""
  - key: join_image
    group: Advanced
    help: "The sign-up page runs in kiwi-server's control image."
    default: ghcr.io/derlocke-ng/kiwi-server-control:2
  - key: separate
    type: bool
    label: Two separate services
    help: "With a public name: keep the service on the VPN as it is (accounts @jabber.<hostname>, nobody outside reaches it) and run a second one for the public name. Their accounts are apart, and the two do not exchange messages."
    default: false
  - key: registration
    type: bool
    label: Open sign-up
    help: "Anyone makes an account without a code: on the page https://<name>/join or in a Jabber app, each after a picture test; one new account per address in ten minutes. Off (the default): only with an invite code, an accepted request, or by the admin."
    default: false
  - key: file_days
    type: int
    label: Files kept (days)
    help: "Files people send are deleted from the server after this many days. 0: kept until the account goes."
    default: 30
  - key: room_creators
    type: enum
    label: Who makes group rooms
    help: "everyone: every account of this server; admins: the admins only."
    default: everyone
    options: [everyone, admins]
  - key: admins
    type: list
    label: More admins
    help: "Accounts of this server (the part before the @) that are admins as well as the first one."
    default: []
  - key: admin_user
    label: Admin
    help: "The first account, and the server's admin: <name>@<the server's name>."
    default: admin
  - key: admin_password
    type: secret
    generate: true
    rotate: restart
    help: "Empty: generated from the fleet's seed."
  - key: upload_mb
    type: int
    label: Largest file (MB)
    help: "The biggest file someone may send."
    default: 100
  - key: history_days
    type: int
    label: History (days)
    help: "How long messages are kept on the server, so that a new device shows them."
    default: 365
  - key: onion
    type: object
    advanced: true
    label: Hidden-service addresses
    help: "Filled in by kiwi-server when the onion module publishes this service (onion.services: jabber, or xmpp for the separate public one): site -> its .onion address. Apps then reach it at that address, and people without a way to check a certificate can have accounts @<address>.onion."
    default: {}
