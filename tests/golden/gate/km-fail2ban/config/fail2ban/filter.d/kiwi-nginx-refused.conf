# kiwi-server: requests the proxy or a site behind it refused (401, 403), as wrong passwords
# and tries at closed pages leave them. Twenty in the jail's time are not a typing mistake.
[Definition]
failregex = ^<HOST> -[^"]*"(?:GET|POST|PUT|PATCH|DELETE|PROPFIND) [^"]* HTTP/[0-9.]+" (?:401|403) 
ignoreregex =
