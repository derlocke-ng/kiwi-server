<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 758" role="img" aria-labelledby="s6-t s6-d">
<title id="s6-t">A service for strangers</title>
<desc id="s6-d">A hidden service on papaya. papaya's Tor runs in its VPN client's network, so its connections go through the WireGuard tunnel to the master sorbet and leave there, through Mullvad or from sorbet's own address. A stranger's Tor Browser and papaya's Tor meet at a relay of the Tor network. Tor hands the connection to nginx on port 8043, which answers as cloud.papaya only. The home's Internet provider sees only WireGuard to sorbet.</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Ubuntu,Cantarell,"Helvetica Neue",Arial,sans-serif;fill:#1e281b}
.panel{fill:#fafbf7;stroke:#d3d9cd;stroke-width:1.5}
.ttl{font-size:22px;font-weight:700}
.sub{font-size:14px;fill:#536050}
.rl{font-size:11.5px;font-weight:700;fill:#5d6a59;letter-spacing:.07em}
.b{font-size:15px;font-weight:700}
.bs{font-size:13px;font-weight:700}
.d{font-size:12.5px;fill:#38432f}
.m{font-size:12px;fill:#5d6a59}
.c{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12px;fill:#1e281b}
.w{fill:#fff}
.wd{font-size:12.5px;fill:#edf6e4}
.reg{fill:#eef1ea;stroke:#c3cbbd;stroke-width:1.5}
.hst{fill:#fff;stroke:#c3cbbd;stroke-width:1.5}
.inet{fill:none;stroke:#9aa395;stroke-width:1.5;stroke-dasharray:6 5}
.ns{fill:none;stroke:#7f8a7b;stroke-width:1.2;stroke-dasharray:4 3}
.ms{fill:#3d7a1f;stroke:#2a5713;stroke-width:2}
.nd{fill:#fff;stroke:#2b3628;stroke-width:2}
.dv{fill:#fff;stroke:#7f8a7b;stroke-width:1.5}
.ct{fill:#f4f6f1;stroke:#7f8a7b;stroke-width:1.2}
.rel{fill:#fff;stroke:#9aa395;stroke-width:1.5}
.mp{fill:#fff;stroke:#6a4c93;stroke-width:2.5}
.tun{fill:none;stroke:#5ea832;stroke-width:14;stroke-linecap:round}
.tunc{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round}
.tor{fill:none;stroke:#6a4c93;stroke-width:2.5;stroke-dasharray:6 4;stroke-linejoin:round}
.req{fill:none;stroke:#2b3628;stroke-width:1.8}
.num{fill:#2b3628}
.tag{fill:#efe9f7;stroke:#6a4c93;stroke-width:1.2}
.tg{font-size:11.5px;font-weight:700;fill:#4a3370}
.note{fill:#fff;stroke:#d3d9cd;stroke-width:1.2}
.lg{font-size:12px;fill:#38432f}
.lgh{stroke:#dfe4da;stroke-width:1.2}
</style>
<defs>
<marker id="s6-ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6a4c93"/></marker>
<marker id="s6-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b3628"/></marker>
</defs>
<rect class="panel" x="1" y="1" width="958" height="756" rx="16"/>
<text class="ttl" x="32" y="48">A service for strangers</text>
<rect class="tag" x="282" y="30" width="96" height="24" rx="12"/><text class="tg" x="330" y="47" text-anchor="middle">from 2.96.0</text>
<text class="sub" x="32" y="73">A hidden service (a Tor onion service) gives one service an address that anyone opens with Tor Browser.</text>

<!-- regions -->
<rect class="reg" x="24" y="100" width="152" height="340" rx="12"/>
<text class="rl" x="40" y="124">ANYWHERE</text>
<rect class="inet" x="192" y="100" width="164" height="340" rx="12"/>
<text class="rl" x="208" y="124">TOR NETWORK</text>
<rect class="hst" x="372" y="100" width="200" height="340" rx="12"/>
<text class="rl" x="388" y="124">AT A HOSTER</text>
<rect class="reg" x="620" y="100" width="316" height="340" rx="12"/>
<text class="rl" x="636" y="124">HOME</text>

<!-- the Tor network -->
<circle class="rel" cx="226" cy="176" r="9"/><circle class="rel" cx="318" cy="186" r="9"/>
<circle class="rel" cx="222" cy="388" r="9"/><circle class="rel" cx="326" cy="392" r="9"/>
<circle class="mp" cx="274" cy="274" r="16"/>
<text class="m" x="274" y="316" text-anchor="middle">the two sides</text>
<text class="m" x="274" y="332" text-anchor="middle">meet at a relay</text>

<!-- stranger -->
<rect class="dv" x="34" y="206" width="132" height="96" rx="18"/>
<text class="b" x="48" y="232">a stranger</text>
<text class="d" x="48" y="252">Tor Browser,</text>
<text class="c" x="48" y="272">http://….onion</text>

<!-- hoster -->
<rect class="dv" x="392" y="132" width="160" height="38" rx="6"/>
<text class="d" x="472" y="156" text-anchor="middle">Mullvad (optional)</text>
<rect class="ms" x="388" y="196" width="168" height="140" rx="10"/>
<text class="b w" x="402" y="222">sorbet · master</text>
<text class="wd" x="402" y="246">papaya's Tor leaves</text>
<text class="wd" x="402" y="263">here: through Mullvad,</text>
<text class="wd" x="402" y="280">or from sorbet's own</text>
<text class="wd" x="402" y="297">address without it.</text>
<text class="wd" x="402" y="321" font-weight="700">No port opened for it.</text>

<rect class="nd" x="652" y="136" width="268" height="290" rx="10"/>
<text class="b" x="666" y="160">papaya · node</text>
<rect class="ns" x="664" y="176" width="244" height="122" rx="8"/>
<text class="m" x="674" y="194">the VPN client's network</text>
<!-- lines -->
<path class="tun" d="M556,256 H676"/><path class="tunc" d="M556,256 H676"/>
<path class="tor" d="M556,256 H676"/>
<path class="tor" d="M166,256 L256,272" marker-end="url(#s6-ap)"/>
<path class="tor" d="M472,196 V170"/>
<path class="tor" d="M392,151 H340 L286,260" marker-end="url(#s6-ap)"/>

<rect class="dv" x="567" y="238" width="58" height="36" rx="6"/>
<text class="d" x="596" y="261" text-anchor="middle">router</text>
<rect class="ct" x="676" y="208" width="104" height="78" rx="6"/>
<text class="bs" x="686" y="230">vpn-client</text>
<text class="m" x="686" y="248">WireGuard</text>
<text class="m" x="686" y="264">to sorbet</text>
<rect class="ct" x="790" y="208" width="114" height="78" rx="6"/>
<text class="bs" x="802" y="230">onion</text>
<text class="m" x="802" y="248">Tor, with no</text>
<text class="m" x="802" y="264">port of its own</text>
<rect class="ct" x="790" y="316" width="114" height="44" rx="6"/>
<text class="bs" x="802" y="334">nginx</text>
<text class="m" x="802" y="351">port 8043</text>
<rect class="ct" x="790" y="378" width="114" height="40" rx="6"/>
<text class="c" x="802" y="396">cloud.papaya</text>
<text class="m" x="802" y="411">Nextcloud</text>
<text class="m" x="676" y="330">Port 8043 is not</text>
<text class="m" x="676" y="346">published: only the</text>
<text class="m" x="676" y="362">machine's own</text>
<text class="m" x="676" y="378">containers reach it.</text>
<path class="tor" d="M780,256 H790"/>
<path class="req" d="M847,286 V314" marker-end="url(#s6-ak)"/>
<path class="req" d="M847,360 V376" marker-end="url(#s6-ak)"/>

<!-- step numbers on the picture -->
<circle class="num" cx="606" cy="214" r="10"/><text class="b w" x="601.5" y="219">1</text>
<circle class="num" cx="372" cy="151" r="10"/><text class="b w" x="367.5" y="156">2</text>
<circle class="num" cx="274" cy="234" r="10"/><text class="b w" x="269.5" y="239">3</text>
<circle class="num" cx="910" cy="338" r="10"/><text class="b w" x="905.5" y="343">4</text>

<!-- what happens -->
<rect class="note" x="24" y="460" width="448" height="96" rx="10"/>
<circle class="num" cx="48" cy="486" r="10"/><text class="b w" x="43.5" y="491">1</text>
<text class="d" x="68" y="490">papaya's Tor opens its connections itself, inside</text>
<text class="d" x="68" y="508">papaya's WireGuard tunnel. Your Internet provider</text>
<text class="d" x="68" y="526">at home sees WireGuard to sorbet and nothing else.</text>
<text class="d" x="68" y="544">A node without a VPN client cannot run one.</text>
<rect class="note" x="488" y="460" width="448" height="96" rx="10"/>
<circle class="num" cx="512" cy="486" r="10"/><text class="b w" x="507.5" y="491">2</text>
<text class="d" x="532" y="490">At sorbet the Tor traffic leaves to the Internet:</text>
<text class="d" x="532" y="508">through the master's VPN exit (Mullvad), or from</text>
<text class="d" x="532" y="526">sorbet's own address when it has none. Tor never</text>
<text class="d" x="532" y="544">leaves through the connection at home.</text>
<rect class="note" x="24" y="568" width="448" height="96" rx="10"/>
<circle class="num" cx="48" cy="594" r="10"/><text class="b w" x="43.5" y="599">3</text>
<text class="d" x="68" y="598">The stranger's Tor Browser and papaya's Tor both</text>
<text class="d" x="68" y="616">connect to the Tor network and meet at a relay.</text>
<text class="d" x="68" y="634">Neither side learns the other's address. No public</text>
<text class="d" x="68" y="652">name and no open port are needed.</text>
<rect class="note" x="488" y="568" width="448" height="96" rx="10"/>
<circle class="num" cx="512" cy="594" r="10"/><text class="b w" x="507.5" y="599">4</text>
<text class="d" x="532" y="598">Tor hands the connection to nginx on port 8043,</text>
<text class="d" x="532" y="616">which only papaya's own containers reach. nginx</text>
<text class="d" x="532" y="634">answers as cloud.papaya and nothing else of the</text>
<text class="d" x="532" y="652">machine. The service's own login still applies.</text>
<text class="c" x="32" y="696">kiwi-server onion ~/kiwi/fleet.yaml cloud.papaya --client anna</text>
<text class="m" x="520" y="696">--client: only for people who have a key</text>
<!-- legend -->
<line class="lgh" x1="24" y1="716" x2="936" y2="716"/>
<path class="tun" d="M36,732 h28"/><path class="tunc" d="M36,732 h28"/>
<text class="lg" x="78" y="736">WireGuard tunnel</text>
<path class="tor" d="M218,732 h36"/>
<text class="lg" x="264" y="736">Tor</text>
<path class="req" d="M313,732 h34" marker-end="url(#s6-ak)"/>
<text class="lg" x="359" y="736">a request</text>
</svg>
