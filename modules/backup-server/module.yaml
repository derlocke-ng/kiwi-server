schema_version: "1.0"

module:
  name: backup-server
  title: Backup store
  version: 1.0.0
  description: "Where the backup module of other machines stores its data: restic's REST server behind the reverse proxy at backup.<hostname>. Each machine reaches only its own repository, and can add to it but not delete."
  category: storage
  node_types: [node]

dependencies:
  required: [vpn-client, reverse-proxy]
  optional: []

network:
  needs_vpn_dnat: true
  open_ports: []

firewall:
  scope: vpn-client
  rules: []

validate:
  - when: "offsite_url and not (offsite_user and offsite_password)"
    error: "backup-server.offsite_url needs offsite_user and offsite_password (the account at the other place)"

templates:
  compose: docker-compose.yml.j2
  htpasswd: htpasswd.j2
  offsite_script: offsite.sh.j2
  offsite_env: offsite.env.j2
  offsite_ca: offsite-ca.pem.j2
  offsite_service: offsite.service.j2
  offsite_timer: offsite.timer.j2

# a third copy of the store at another place (offsite_url): rclone puts it there, encrypted once
# more with a key from the fleet's seed, names included; the place sees nothing it could read
outputs:
  htpasswd: { path: "{{ container_prefix }}-backup-server/htpasswd", mode: 0600 }
  offsite_script: { path: "kiwi/backup-offsite.sh", mode: 0755, when: offsite }
  offsite_env: { path: "{{ container_prefix }}-backup-server/offsite.env", mode: 0600, when: offsite }
  offsite_ca: { path: "{{ container_prefix }}-backup-server/offsite-ca.pem", mode: 0644, when: offsite_ca }
  offsite_service: { kind: host_unit, name: "{{ container_prefix }}-backup-offsite.service", when: offsite }
  offsite_timer: { kind: host_unit, name: "{{ container_prefix }}-backup-offsite.timer", when: offsite }

derived:
  backup_host: "{{ backup_domain or 'backup.' ~ hostname }}"
  data_path: "{{ data_dir or docker_dir ~ '/' ~ container_prefix ~ '-backup-server/data' }}"
  offsite: "{{ 'yes' if offsite_url else '' }}"

storage:
  bind_mounts:
    - { host: "{{ data_path }}", type: dir, required: true }

urls:
  - "Backup server: https://{{ backup_host }} — for the backup module of: {{ clients | join(', ') or 'nobody yet (backup-server.clients)' }}"
  - "{% if offsite %}Copy at another place: {{ offsite_url }}, every night at {{ offsite_time }}, encrypted before it leaves{% endif %}"

# how this part is named on the network: the setting that holds its name, and its own word.
# By default it is backup.<machine>.<domain>; kiwi-server can name it backup.<domain> and keeps
# its name when the part moves to another machine.
named_by: { setting: backup_domain, word: backup }

nginx:
  upstream:
    name: backup-server
    server: "{{ container_prefix }}-backup-server:8000"
  server_name: "{{ backup_host }}"
  proxy_pass: "http://backup-server"
  client_max_body_size: "0"
  proxy_read_timeout: 600s
  comment: Backups
  admin: true          # machines back up here from their own addresses; no page for people
  extra_directives:
    - "proxy_request_buffering off;"

settings:
  - key: clients
    type: list
    label: Machines that back up here
    help: "Full names, e.g. papaya.home. Each gets its own repository and, from the fleet's seed, its own password."
    default: []
    pattern: '[a-z0-9.-]+'
  - key: data_dir
    label: Where the backups live
    help: "A big disk, not the one the data comes from. Empty: under the stack directory."
    default: ""
    pattern: '(/[A-Za-z0-9._/-]+)?'
  - key: backup_domain
    label: Name
    help: "Empty: backup.<hostname>."
    default: ""
    pattern: '[a-z0-9.-]*'
  - key: keep_daily
    type: int
    label: Days to keep
    help: "kiwi-server prune keeps the newest snapshot of this many days."
    default: 7
  - key: keep_weekly
    type: int
    label: Weeks to keep
    help: "And of this many weeks."
    default: 4
  - key: keep_monthly
    type: int
    label: Months to keep
    help: "And of this many months."
    default: 6
  - key: offsite_url
    group: Copy at another place
    label: WebDAV folder
    help: "A third copy of every machine's backups, at another place: a WebDAV folder (1&1 SmartDrive, a Nextcloud, …), e.g. https://sd2dav.1und1.de/kiwi. Every night it gets what is new here, encrypted once more before it leaves, names included: the place holds nothing it could read. Empty: no such copy."
    default: ""
    pattern: '(https://[^ ]+)?'
  - key: offsite_user
    group: Copy at another place
    label: User name there
    help: "The account's user name at the other place (at 1&1: the e-mail address or customer number)."
    default: ""
  - key: offsite_password
    type: secret
    group: Copy at another place
    label: Password there
    help: "Kept in the network's secret store, not in the fleet file."
    default: ""
  - key: offsite_ca
    type: text
    group: Copy at another place
    label: Its certificate authority
    help: "For a WebDAV server whose certificate a CA of its own signed (a friend's Nextcloud): that CA's certificate, PEM. Empty: the usual public ones."
    default: ""
  - key: offsite_time
    group: Copy at another place
    label: Time of day
    help: "When the copy is brought up to date: after the machines' nightly backups (03:00)."
    default: "05:30"
    pattern: '([01][0-9]|2[0-3]):[0-5][0-9]'
  - key: offsite_bwlimit
    group: Copy at another place
    label: Speed limit
    help: "At most this much a second for the copy, e.g. 5M; the home line stays usable meanwhile. Empty: no limit."
    default: ""
    pattern: '([0-9]+[KMG]?)?'
  - key: offsite_key
    type: secret
    generate: true
    group: Generated
    help: "Encrypts the copy at the other place once more, names included (each machine's backups are encrypted with its own key already). From the fleet's seed: the seed brings the copy back."
  - key: offsite_image
    group: Advanced
    help: "rclone, which makes the copy."
    default: docker.io/rclone/rclone:1.75.2
  - key: client_hashes
    type: map
    group: Generated
    label: Password hashes of the clients
    help: "Filled in from the fleet's seed."
    default: {}
    generate_each: clients
    generate_hash_of: backup/server_password
  - key: image
    group: Advanced
    help: "The container image this module runs, pinned by tag. Change it to try another version or to pin a newer one."
    default: docker.io/restic/rest-server:0.14.0
