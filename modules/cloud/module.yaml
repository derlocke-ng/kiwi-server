schema_version: "1.0"

module:
  name: cloud
  title: Nextcloud
  version: 2.0.0
  description: "Nextcloud from the AIO project's containers, without the AIO master container: no docker socket, runs on podman, secrets generated at render, updates and backups through kiwi-stack. Collabora, Talk, Imaginary, ClamAV, full-text search and the whiteboard are switches."
  category: productivity
  node_types: [node]

dependencies:
  required: [vpn-client, reverse-proxy]
  optional: [dns]

network:
  needs_vpn_dnat: true
  # Talk's TURN port when Talk runs; 80/443 come with the reverse proxy
  open_ports: ["{% if talk %}{{ talk_port }}/tcp{% endif %}", "{% if talk %}{{ talk_port }}/udp{% endif %}"]

firewall:
  scope: vpn-client
  rules: []

templates:
  compose: docker-compose.yml.j2
  kiwi_config: kiwi.config.php.j2
  folders_script: cloud-folders.sh.j2
  folders_service: kn-cloud-folders.service.j2

derived:
  has_folders: "{{ 'yes' if shared_folders or read_only_folders else '' }}"

outputs:
  kiwi_config: { path: "nextcloud-aio-nextcloud/kiwi.config.php", mode: 0644 }
  folders_script: { path: "kiwi/cloud-folders.sh", mode: 0755, when: has_folders }
  folders_service: { kind: host_unit, name: kn-cloud-folders.service, when: has_folders }

storage:
  volumes: [nextcloud_aio_nextcloud, nextcloud_aio_apache, nextcloud_aio_database, nextcloud_aio_database_dump, nextcloud_aio_redis]
  bind_mounts:
    - { host: "{{ nextcloud_datadir or docker_dir ~ '/knnc-data' }}", type: dir, required: true }
    - { host: "{{ nextcloud_mount }}", type: dir, required: false }
    - { each: shared_folders, type: dir }
    - { each: read_only_folders, type: dir }

validate:
  - when: "collabora and onlyoffice"
    error: "collabora and onlyoffice cannot both be on — Nextcloud takes one office server"
  - when: "talk_recording and not talk"
    error: "talk_recording needs talk"
  - when: "shared_folders.keys() | select('in', read_only_folders.keys()) | list"
    error: "a name in shared_folders is in read_only_folders too — Nextcloud shows one folder per name"
  - when: "nextcloud_datadir and nextcloud_datadir in shared_folders.values()"
    error: "shared_folders must not hold the data directory: Nextcloud's own files are not a shared folder"

urls:
  - "Nextcloud: https://{{ nc_hostname or 'cloud.' ~ hostname }} — user admin, the cloud.admin_password setting"

nginx:
  servers:
    - server_name: "{{ nc_hostname or 'cloud.' ~ hostname }}"
      proxy_pass: "http://nextcloud-aio-apache:{{ apache_port }}"
      comment: Nextcloud
      hsts: true
      client_max_body_size: "0"
      proxy_read_timeout: 86400s
      cors:
        origins: cors_origins
        path: /remote.php/dav/
        methods: "GET, PUT, DELETE, PROPFIND, REPORT, OPTIONS"
        allow_headers: "Authorization, Content-Type, Depth, If-Match, If-None-Match, Prefer"
        expose_headers: "ETag, DAV, Location"
      extra_directives:
        - "proxy_set_header Connection $http_connection;"
        - "proxy_redirect off;"
        - "rewrite ^/\\.well-known/carddav https://$server_name/remote.php/dav/ redirect;"
        - "rewrite ^/\\.well-known/caldav https://$server_name/remote.php/dav/ redirect;"
        - "rewrite ^/\\.well-known/webfinger https://$server_name/index.php/.well-known/webfinger redirect;"
        - "rewrite ^/\\.well-known/nodeinfo https://$server_name/index.php/.well-known/nodeinfo redirect;"

backup:
  frozen:
    containers: [nextcloud-aio-database]
    volumes: [nextcloud_aio_database]
  paths:
    - "{{ nextcloud_datadir or docker_dir ~ '/knnc-data' }}"
    - { each: shared_folders }
  volumes: [nextcloud_aio_nextcloud]
  exclude: ["appdata_*/preview"]

settings:
  - key: nc_hostname
    label: Nextcloud hostname
    help: "Empty: cloud.<hostname>."
    default: ""
  - key: admin_password
    type: secret
    generate: true
    label: Admin password
    help: "The password of the Nextcloud user `admin`, set on the first start. Empty: generated from the fleet's seed."
  - key: nextcloud_datadir
    label: Data directory
    help: "Where the files live, e.g. a big disk mounted at /mnt/data/nextcloud. Empty: <stack directory>/knnc-data. Do not change after the first start."
    default: ""
  - key: nextcloud_mount
    label: Host directory Nextcloud may reach
    help: "For external storage inside Nextcloud, e.g. /mnt/. Must not be the data directory. Empty: none."
    default: ""
  - key: shared_folders
    type: map
    label: Folders everyone can see
    help: "Name=host path, e.g. Photos=/mnt/data/shared/Photos: a folder in every user's Nextcloud, which other apps on this host can use as well. It becomes the property of Nextcloud's user (uid 33). An entry taken out again stays in Nextcloud until an admin removes it under Administration, External storage."
    default: {}
    key_pattern: '[A-Za-z0-9_-]+'
    pattern: '/[A-Za-z0-9._/-]+'
  - key: read_only_folders
    type: map
    label: Folders everyone can read
    help: "The same, but nothing can be changed through Nextcloud and the owner stays as it is: uid 33 must be able to read them. For what another app produces."
    default: {}
    key_pattern: '[A-Za-z0-9_-]+'
    pattern: '/[A-Za-z0-9._/-]+'
  - key: collabora
    type: bool
    group: Services
    label: Collabora Online
    help: Office documents in the browser. Not together with OnlyOffice.
    default: true
  - key: onlyoffice
    type: bool
    group: Services
    label: OnlyOffice
    help: "Office documents in the browser with OnlyOffice. Not together with Collabora: turn that off first."
    default: false
  - key: talk
    type: bool
    group: Services
    label: Talk (calls)
    help: "Publishes the TURN port (talk_port) on the host."
    default: false
  - key: talk_recording
    type: bool
    group: Services
    label: Talk recording
    help: "Lets moderators record Talk calls; the recordings are kept as files in Nextcloud. Needs talk."
    default: false
  - key: imaginary
    type: bool
    group: Services
    label: Imaginary (previews)
    help: "Picture previews made in a container of their own: faster, and also for HEIC, TIFF and SVG. Off: Nextcloud makes the previews it can by itself."
    default: true
  - key: clamav
    type: bool
    group: Services
    label: ClamAV (virus scan of uploads)
    help: "Scans uploaded files for viruses, up to upload_limit in size. Its container wants about a gigabyte of memory."
    default: false
  - key: fulltextsearch
    type: bool
    group: Services
    label: Full-text search
    help: Elasticsearch — needs a few GB of RAM.
    default: false
  - key: whiteboard
    type: bool
    group: Services
    label: Whiteboard
    help: "A whiteboard several people draw on at the same time, in Nextcloud's Whiteboard app."
    default: false
  - key: cors_origins
    type: list
    label: Hubs elsewhere that may use the calendar
    help: "Origins of kiwi hubs on other servers whose calendar app may talk to this Nextcloud from the browser, e.g. https://derlocke-ng.github.io (Armory). Empty: none; a hub of this fleet reaches it through its own container (hub.caldav)."
    default: []
    pattern: 'https://[A-Za-z0-9.-]+(:[0-9]+)?'
  - key: apache_port
    type: int
    group: Advanced
    help: The port Nextcloud's apache listens on behind nginx; never published on the host.
    default: 11000
  - key: upload_limit
    help: "The largest file one upload may be, e.g. 50G or 512M. Also the largest file ClamAV scans."
    default: 50G
  - key: max_time
    type: int
    help: "How long, in seconds, one request may run before it is cut off, e.g. a slow upload. The default is 100 hours."
    default: 360000
  - key: memory_limit
    help: "The memory one Nextcloud PHP process may use, e.g. 512M or 4096M. Raise it when previews or apps fail for lack of memory."
    default: 4096M
  - key: startup_apps
    label: Apps installed on first start
    help: "App ids separated by spaces, installed when Nextcloud starts for the first time; a - in front disables one, e.g. -dashboard. Later, apps are added on Nextcloud's Apps page."
    default: deck twofactor_totp tasks calendar contacts notes end_to_end_encryption
  - key: additional_apks
    group: Advanced
    help: "Alpine packages installed into the Nextcloud container when it starts, separated by spaces. Keep imagemagick in the list, which the imagick PHP extension works with."
    default: imagemagick
  - key: additional_php_extensions
    group: Advanced
    help: "PHP extensions added to the Nextcloud container when it starts, separated by spaces. Keep imagick in the list: Nextcloud uses it for some previews and for the theming app's icons."
    default: imagick
  - key: enable_dri_device
    type: bool
    label: Hardware transcoding (/dev/dri)
    help: Only if the host has /dev/dri; the container fails to start otherwise.
    default: false
  - key: keep_disabled_apps
    type: bool
    group: Advanced
    help: "Off: when a service here is switched off, e.g. collabora, Nextcloud's app for it is removed as well. On: the app stays installed without the service."
    default: false
  - key: install_latest_major
    type: bool
    group: Advanced
    label: Install the latest major version on first start
    help: "On: a new installation is upgraded right away to Nextcloud's newest major version instead of staying on the image's. No effect on a Nextcloud already installed."
    default: false
  - key: update_nextcloud_apps
    type: bool
    group: Advanced
    label: Update Nextcloud apps on Saturdays
    help: "On: when the Nextcloud container starts on a Saturday, it updates its apps from the app store. Off: an admin updates them on the Apps page."
    default: false
  - key: talk_port
    type: int
    group: Advanced
    help: "The port of Talk's TURN server, published on the host for TCP and UDP while talk is on. Callers outside the network must be able to reach it."
    default: 3478
  - key: collabora_dictionaries
    group: Advanced
    help: "The spelling dictionaries Collabora offers, as language codes separated by spaces, e.g. de_DE en_US."
    default: de_DE en_GB en_US es_ES fr_FR it nl pt_BR pt_PT ru
  - key: collabora_log_level
    group: Advanced
    help: "How much Collabora writes to its log: fatal, critical, error, warning, notice, information, debug or trace."
    default: warning
  - key: fulltextsearch_java_options
    group: Advanced
    help: "Java options of Elasticsearch, mostly its memory: -Xms and -Xmx set the same, e.g. -Xms1G -Xmx1G for a big index. Only with fulltextsearch."
    default: -Xms512M -Xmx512M
  - key: log_level
    type: enum
    options: [debug, info, warn, error]
    group: Advanced
    help: "How much the Nextcloud containers write to their logs, from debug (most) to error (least)."
    default: warn
  - key: database_password
    type: secret
    generate: true
    # Nextcloud keeps it in config.php, its database in two roles: the config first (occ still
    # gets in with the old one), then the roles. The first step is skipped when it is done.
    rotate:
      - name: nextcloud-aio-nextcloud
        run: |-
          php -r 'include "/var/www/html/config/config.php"; exit($CONFIG["dbpassword"] === getenv("NEW") ? 0 : 1);' || su-exec www-data php /var/www/html/occ config:system:set dbpassword --value="$NEW" >/dev/null
      - name: nextcloud-aio-database
        run: |-
          psql -v ON_ERROR_STOP=1 -U nextcloud -d nextcloud_database -c "ALTER USER oc_nextcloud WITH PASSWORD '$NEW'" -c "ALTER USER nextcloud WITH PASSWORD '$NEW'"
    group: Generated
    help: "Empty: generated from the fleet's seed, the same at every render."
  - key: redis_password
    type: secret
    generate: true
    rotate: restart
    group: Generated
    help: "The password of Nextcloud's Redis cache, which the whiteboard uses as well. Empty: generated from the fleet's seed."
  - key: turn_secret
    type: secret
    generate: true
    group: Generated
    help: "Shared by Nextcloud and Talk's TURN server, which lets callers through with it. Empty: generated from the fleet's seed."
  - key: signaling_secret
    type: secret
    generate: true
    group: Generated
    help: "Shared by Nextcloud and Talk's signaling server. Empty: generated from the fleet's seed."
  - key: talk_internal_secret
    type: secret
    generate: true
    rotate: restart
    group: Generated
    help: "Shared by Talk's signaling server and its recording server. Empty: generated from the fleet's seed."
  - key: recording_secret
    type: secret
    generate: true
    group: Generated
    help: "Shared by Nextcloud and Talk's recording server. Empty: generated from the fleet's seed."
  - key: onlyoffice_secret
    type: secret
    generate: true
    rotate: restart
    group: Generated
    help: "Signs what Nextcloud and OnlyOffice send each other. Empty: generated from the fleet's seed."
  - key: imaginary_secret
    type: secret
    generate: true
    rotate: restart
    group: Generated
    help: "Shared by Nextcloud and Imaginary. Empty: generated from the fleet's seed."
  - key: fulltextsearch_password
    type: secret
    generate: true
    group: Generated
    help: "The password of Elasticsearch's user elastic, which Nextcloud signs in with. Empty: generated from the fleet's seed."
  - key: whiteboard_secret
    type: secret
    generate: true
    rotate: restart
    group: Generated
    help: "Signs the tokens Nextcloud hands to the whiteboard server. Empty: generated from the fleet's seed."
  - key: extra_env
    type: map
    group: Advanced
    label: Extra environment variables
    help: KEY=value, passed to the Nextcloud container as they are.
    default: {}
  - key: image_prefix
    group: Advanced
    help: Where the AIO containers come from; the tag applies to all of them.
    default: ghcr.io/nextcloud-releases/
  - key: image_tag
    group: Advanced
    help: "The tag of all the AIO container images this module runs, which pins their version. Change it to try another version or to pin a newer one. The default, latest, follows each new release."
    default: latest
