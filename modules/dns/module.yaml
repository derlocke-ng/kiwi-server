schema_version: "1.0"

module:
  name: dns
  title: Ad blocker (Pi-hole)
  version: 1.2.0
  description: "Pi-hole v6 — ad-blocking resolver for the mesh or the LAN, forwarding to the VPN client's DNS-over-TLS; serves the fleet's own names and, optionally, the Mullvad SOCKS5 proxies'"
  category: core

dependencies:
  required: []
  optional: [vpn-client, vpn-server, reverse-proxy]

# Pi-hole's web server listens on web_port_effective; in a shared namespace
# the reverse proxy owns 80 and 443, so the effective port moves to 8081
derived:
  shares_proxy_namespace: "{{ 'yes' if network_mode and module_config.get('reverse-proxy', {}).get('network_mode') == network_mode else '' }}"
  web_port_effective: "{{ web_port or (8081 if (network_mode and module_config.get('reverse-proxy', {}).get('network_mode') == network_mode) else 80) }}"
  federation_ask: "{{ 'yes' if node_type == 'master' and (module_config.get('vpn-server') or {}).get('federation') else '' }}"
  # a node's way to the names of the Internet: the master's Pi-hole while it answers, the fallbacks
  # (over TLS) while it does not, switched by a small resolver in front of Pi-hole (Corefile.j2).
  # Pi-hole's own order switched only when a client asked a second time: while the master was down
  # a lookup took five seconds, or got no answer (the master-down drill, 20 Nov 2026)
  dns_up: "{{ 'yes' if node_type != 'master' and master_ip and fallback_dns and not upstream_dns and not legacy_env else '' }}"
  # names of parts that can move (kept ready on another machine): in a file of their own (moving.hosts.j2)
  moving: "{{ 'yes' if fleet_records and moving_names else '' }}"

network:
  listen_ports: ["53/tcp", "53/udp", "{{ web_port_effective }}/tcp", "{% if ntp %}123/udp{% endif %}"]
  needs_vpn_dnat: false
  # on the host only when Pi-hole has its own address; inside another
  # container's network (the master) clients reach it through the tunnel
  open_ports: ["{% if not network_mode %}53/tcp{% endif %}", "{% if not network_mode %}53/udp{% endif %}", "{% if ntp and not network_mode %}123/udp{% endif %}"]

firewall:
  scope: self
  rules: []

validate:
  - when: "mullvad_socks and not mullvad_socks_url"
    error: "mullvad_socks_url is required while mullvad_socks is on"

templates:
  compose: docker-compose.yml.j2
  corefile: Corefile.j2
  mullvad_socks_script: mullvad-socks.sh.j2
  mullvad_socks_service: mullvad-socks.service.j2
  mullvad_socks_timer: mullvad-socks.timer.j2
  mullvad_socks_about: mullvad-socks.about.j2
  moving_hosts: moving.hosts.j2
  blocklist_script: blocklist.sh.j2
  blocklist_service: blocklist.service.j2
  blocklist_timer: blocklist.timer.j2
  federation_ask: federation-ask.j2

# the fleet's DNS records go in as FTLCONF_dns_hosts (pihole.toml dns.hosts):
# Pi-hole 6 regenerates hosts/custom.list itself, a file put there is ignored.
# The Mullvad SOCKS5 records change without a render, so they live in a hosts
# file of their own that a host timer refreshes; dnsmasq watches its directory
# (hostsdir) and reloads it by itself. The directory is root's and mounted
# read-only: root writes there every 6 hours, so nothing in the container may
# (a rendered file in it keeps it root's, not the service user's).
outputs:
  mullvad_socks_script: { path: "kiwi/mullvad-socks.sh", mode: 0755, when: mullvad_socks }
  mullvad_socks_service: { kind: host_unit, name: "{{ container_prefix }}-mullvad-socks.service", when: mullvad_socks }
  mullvad_socks_timer: { kind: host_unit, name: "{{ container_prefix }}-mullvad-socks.timer", when: mullvad_socks }
  mullvad_socks_about: { path: "{{ container_prefix }}-pihole/mullvad-socks/.kiwi-server", mode: 0644, when: mullvad_socks }
  # the names of parts kept ready on another machine: a switch rewrites the file (kiwi-server switch)
  moving_hosts: { path: "{{ container_prefix }}-pihole/moving/kiwi.hosts", mode: 0644, when: moving }
  # an empty blocklist is fetched again (blocklist.sh.j2 says why it can be empty)
  blocklist_script: { path: "kiwi/pihole-blocklist.sh", mode: 0755 }
  blocklist_service: { kind: host_unit, name: "{{ container_prefix }}-pihole-blocklist.service" }
  blocklist_timer: { kind: host_unit, name: "{{ container_prefix }}-pihole-blocklist.timer" }
  # the linked networks whose DNS kiwi-server's status asks what they open to this one
  federation_ask: { path: "kiwi/federation-ask", mode: 0644, when: federation_ask }
  # the resolver in front of Pi-hole on a node (dns_up above)
  corefile: { path: "{{ container_prefix }}-pihole/Corefile", mode: 0644, when: dns_up }

storage:
  bind_mounts:
    - { host: "${DOCKERDIR}/{{ container_prefix }}-pihole/etc-pihole", type: dir, required: true }
    - { host: "${DOCKERDIR}/{{ container_prefix }}-pihole/etc-dnsmasq.d", type: dir, required: true }
    # exists before Pi-hole starts: dnsmasq only watches a hostsdir it found at startup
    - { host: "${DOCKERDIR}/{{ container_prefix }}-pihole/mullvad-socks", type: dir, required: true, when: mullvad_socks }
    - { host: "${DOCKERDIR}/{{ container_prefix }}-pihole/moving", type: dir, required: true, when: moving }

host_integration:
  # Fedora CoreOS / uCore run systemd-resolved's stub on 127.0.0.53:53
  disable_resolved_stub: true

urls:
  - "Pi-hole admin: https://{{ pihole_hostname or 'pihole.' ~ hostname }}/admin (through the reverse proxy){% if expose_web_ui %}, http://{{ web_ui_bind or '<this host>' }}:{{ web_ui_port }}/admin{% endif %}"

logins:
  - label: Ad blocker (Pi-hole)
    path: /admin
    password: pihole_password
    note: "Pi-hole asks for the password only."

nginx:
  servers:
    - server_name: "{{ pihole_hostname or 'pihole.' ~ hostname }}"
      admin: true
      # inside the WireGuard server's namespace Pi-hole has no name of its own: nginx
      # in the same namespace reaches it at localhost, from outside through the server
      proxy_pass: "http://{% if network_mode %}{{ '127.0.0.1' if module_config.get('reverse-proxy', {}).get('network_mode') == network_mode else container_prefix ~ '-' ~ network_mode }}{% else %}{{ container_prefix }}-pihole{% endif %}:{{ web_port_effective }}"
      when: has_reverse_proxy
      comment: Pi-hole admin

settings:
  - key: partner_domains
    type: list
    group: Generated
    label: Linked networks' domains
    help: "The domains of the networks linked to this one (federation.yaml; kiwi-server fills it in): a node's Pi-hole asks the master for them, which asks the partner."
    default: []
  - key: pihole_password
    type: secret
    generate: true
    rotate: restart
    label: Admin password
    help: "Empty: generated from the fleet's seed."
  - key: upstream_dns
    label: Upstream resolvers
    help: "Semicolon separated, overrides the chain. Empty: on a node the master's Pi-hole (stack setting master_ip), so the whole network shares one blocklist and leaves through the master's exit; on a master the VPN client's DNS-over-TLS resolver; in a network without a master (vpn: false) the fallback resolvers below, asked unencrypted from your home line: set your own here (your router's, say) if you would rather. Names under the fleet's domain always go to the master and never leave it."
    default: ""
  - key: fallback_dns
    label: Fallback resolvers
    help: "Semicolon separated. On a node: asked while the master does not answer, from the node's own line (the master's tunnel is down then), by the resolver in front of Pi-hole. On the master: tried in order after its VPN client's resolver; the master's traffic all leaves through its exit, so these help only when that resolver fails, not when the exit is down. Empty: none."
    default: 1.1.1.1;1.0.0.1
  - key: fallback_tls_name
    label: Fallback resolvers over TLS
    help: "On a node, the fallback resolvers are asked over TLS (port 853) and must show a certificate for this name, so the home line's provider does not read the names while the master is away. Empty: asked in plain text on port 53."
    default: cloudflare-dns.com
  - key: up_image
    group: Advanced
    label: Image of the resolver in front of Pi-hole
    help: "On a node: CoreDNS, which asks the master while it answers and the fallbacks while it does not."
    default: docker.io/coredns/coredns:1.12.4
  - key: network_mode
    group: Advanced
    label: Share a container's network
    help: "Empty: own address with ports 53 published on the host (a node). vpn-server: run inside the WireGuard server's network stack, reachable for clients at the server's mesh address (the master)."
    default: ""
  - key: expose_web_ui
    type: bool
    label: Publish the web UI on the host
    help: "Plain HTTP on web_ui_bind:web_ui_port. The reverse proxy serves the admin page over TLS at pihole.<hostname> anyway."
    default: false
  - key: web_ui_bind
    label: Web UI bind address
    help: "127.0.0.1 (reach it with ssh -L), or 0.0.0.0 for the whole LAN."
    default: 127.0.0.1
  - key: web_ui_port
    group: Advanced
    type: int
    help: "The host port of the web UI while expose_web_ui is on: http://<web_ui_bind>:<this port>/admin."
    default: 8080
  - key: web_port
    type: int
    group: Advanced
    label: Web server port inside the container
    help: "Empty: 80, or 8081 when Pi-hole shares the WireGuard server's network namespace with the reverse proxy (the master), which owns 80 and 443 there."
    default: 0
  - key: ntp
    type: bool
    label: Serve the time (NTP)
    help: "Pi-hole answers time questions (NTP, port 123) from this machine's clock: the network's machines at this site ask it first, and so do the devices on its LAN (handed out with DHCP when Pi-hole is the DHCP server). Pi-hole never sets the clock itself: the machine's own time service does that."
    default: true
  - key: dhcp_enabled
    type: bool
    group: DHCP
    label: Be the LAN's DHCP server
    help: "Pi-hole hands out the leases (with the dhcp-relay module, since Pi-hole sits in a bridge network). Turn the router's DHCP server off."
    default: false
  - key: dhcp_start
    group: DHCP
    label: First address
    help: "The lowest address Pi-hole hands out, in the LAN's subnet. Keep addresses set by hand, e.g. of servers and printers, outside the range."
    placeholder: 192.168.1.100
    default: ""
  - key: dhcp_end
    group: DHCP
    label: Last address
    help: "The highest address Pi-hole hands out, in the same subnet as the first."
    placeholder: 192.168.1.250
    default: ""
  - key: dhcp_router
    group: DHCP
    label: Gateway handed to clients
    help: "The LAN router, or this machine's LAN address when the gateway module routes the LAN through the VPN."
    placeholder: 192.168.1.1
    default: ""
  - key: dhcp_lease_time
    group: DHCP
    label: Lease time
    help: "How long a device keeps its address before it asks again, e.g. 1h, 24h or 7d."
    default: 24h
  - key: pihole_hostname
    label: Admin hostname
    help: "Empty: pihole.<hostname>. Served by the reverse proxy when there is one."
    default: ""
  - key: fleet_records
    type: bool
    label: Serve the fleet's names
    help: "Local DNS records for every host and service in the fleet (split-horizon DNS): their mesh addresses, except that a node on this node's own LAN answers with its LAN address."
    default: true
  - key: extra_records
    group: Advanced
    type: map
    label: Extra local records
    help: name=address, added to the fleet's records.
    default: {}
  - key: mullvad_socks
    type: bool
    group: Mullvad SOCKS5
    label: Serve the Mullvad SOCKS5 proxies' names
    help: "Local records for every Mullvad SOCKS5 proxy — de-fra-wg-socks5-001.relays.mullvad.net and the short de-fra-001.mullvad.<domain> — refreshed every 6 hours by a host timer. The VPN client refuses these private-range answers (DNS rebinding protection), so without the records the names only resolve through the fallback resolvers. The proxies answer through a Mullvad connection: on by default on a master, whose exit is Mullvad; nodes ask the master."
    default: false
  - key: mullvad_socks_url
    group: Mullvad SOCKS5
    label: Proxy list
    help: "https:// (or a file:// on the machine). One IPv4 address and one name per line, comment lines allowed; any other line rejects the whole download and the current records stay. Only *.relays.mullvad.net names at 10.x.x.x addresses are taken from it, so the list can never redirect another name."
    pattern: '(https|file)://\S+'
    placeholder: https://raw.githubusercontent.com/derlocke-ng/mullvad-socks5/list/mullvad-socks.hosts
    default: https://raw.githubusercontent.com/derlocke-ng/mullvad-socks5/list/mullvad-socks.hosts
  - key: mullvad_socks_domain
    group: Mullvad SOCKS5
    label: Short names under
    help: "The short names are <cc>-<city>-<n>.<this>. Empty: mullvad.<the fleet's domain>, or no short names without a fleet domain."
    pattern: '[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?)*\.?'
    placeholder: socks.home
    default: ""
  - key: legacy_env
    type: bool
    group: Advanced
    label: Pi-hole 5 variables
    help: Emit WEBPASSWORD / PIHOLE_DNS_ / DNSMASQ_LISTENING for a pre-6 image.
    default: false
  - key: extra_env
    type: map
    group: Advanced
    label: Extra environment variables
    help: "KEY=value, e.g. FTLCONF_dns_domainNeeded=true — any Pi-hole 6 setting as FTLCONF_<section>_<key>. FTLCONF_misc_dnsmasq_lines (';' between lines) is added to the module's own dnsmasq lines instead of replacing them."
    default: {}
  - key: image
    group: Advanced
    help: "The container image this module runs, pinned by tag. Change it to try another version or to pin a newer one. The default, latest, follows each new release."
    default: docker.io/pihole/pihole:latest
