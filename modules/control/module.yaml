schema_version: "1.0"

module:
  name: control
  title: Control page
  version: 1.1.1
  description: "The control node (design/control-plane.md in kiwi-server): kiwi-server with web pages at control.<hostname>, for the mesh only. It keeps the fleet file and the secrets as the encrypted store, which its password opens into RAM; then it looks at every machine by itself, sends the role to RAM masters, and applies from a phone."
  category: system
  node_types: [node]

dependencies:
  required: [reverse-proxy]
  optional: []

network:
  needs_vpn_dnat: true     # served by the reverse proxy on the mesh address
  open_ports: []

firewall:
  scope: self
  rules: []

templates:
  compose: docker-compose.yml.j2

storage:
  bind_mounts:
    # fleet.yaml, secrets.age (encrypted), control/ (salt, audit log); kiwi-server control push fills it
    - { host: "${DOCKERDIR}/{{ container_prefix }}-control", type: dir, required: true }

urls:
  - "Control: https://{{ control_hostname or 'control.' ~ hostname }} (from the mesh)"
  - "{% if status_page %}Status: https://{{ status_hostname or 'status.' ~ hostname }} (no login){% endif %}"
  - "{% if play_page %}Game page: https://{{ play_hostname or 'play.' ~ hostname }} (the network's accounts, group {{ play_group }}){% endif %}"

logins:
  - label: Control page
    note: "It opens with the password chosen when the page was set up. The network keeps no copy of it."

# the status page's door to the Internet is a page of its own, under its own name
pages:
  status: {label: Status page, about: Whether everything works, public: public_status_hostname}

nginx:
  upstream:
    name: control
    server: "{{ container_prefix }}-control:8740"
  server_name: "{{ control_hostname or 'control.' ~ hostname }}"
  proxy_pass: "http://control"
  proxy_read_timeout: 300s
  comment: Kiwi control
  admin: true          # an admin page: only for VPN groups that are given the admin pages
  extra_directives:
    - "allow {{ mesh_subnet }};"
    - "{% if allow_from %}allow {{ allow_from }};{% endif %}"
    - "allow 127.0.0.1;"
    - "deny all;"
  servers:
    # the status page: how the network is, for everyone on it, without a login. Whatever is asked
    # for at this name, the control part is asked for /status and nothing else. It is no admin
    # page: who may reach this machine's web pages may open it.
    - server_name: "{{ status_hostname or 'status.' ~ hostname }}"
      # usable as a hidden service: the start and status pages read only; tried through Tor
      onion: true
      site: status
      # the status page: every service, what it is for, whether it works, the game servers
      proxy_pass: "http://control/start"
      extra_locations:
        - path: "= /status"
          config: >-
            set $page http://{{ container_prefix }}-control:8740/status;
            proxy_pass $page;
            proxy_set_header Host $host;
      when: status_page
      comment: Kiwi start and status pages (no login; the control part's /start and /status only)
    # the same for strangers, under a public name: only what is open to the Internet, and whether it
    # works. Whatever is asked for at this name, the control part is asked for /status/public.
    - server_name: "{{ public_status_hostname }}"
      # usable as a hidden service: the status page reads only; tried through Tor
      onion: true
      site: status-public
      # the status page for strangers: what is open to the Internet, whether it works, how to get an account
      proxy_pass: "http://control/start/public"
      extra_locations:
        - path: "= /status"
          config: >-
            set $page http://{{ container_prefix }}-control:8740/status/public;
            proxy_pass $page;
            proxy_set_header Host $host;
      when: public_status_hostname
      comment: Kiwi front page and status for the Internet (the services with a public name only)
    # the game page: people of the network's accounts in one group start, stop and wake the game
    # servers and read their logs. Whatever is asked for at this name, the control part is asked
    # for /play/… and nothing else. No admin page: who may reach this machine's web pages gets the
    # sign-in, and only the group's members get past it.
    - server_name: "{{ play_hostname or 'play.' ~ hostname }}"
      site: play
      proxy_pass: "http://control/play$request_uri"
      when: play_page
      comment: Kiwi game page (the network's accounts; the control part's /play/ only)

backup:
  # the fleet itself, its secrets encrypted: without it the network has no CA, no seed and no secrets
  paths: ["${DOCKERDIR}/{{ container_prefix }}-control"]

validate:
  - when: "public_status_hostname and (public_status_hostname ~ '.').endswith('.' ~ domain ~ '.')"
    error: "control.public_status_hostname is for a public name (status.example.org). On the VPN the status page is status.<hostname>"

settings:
  - key: image
    group: Advanced
    label: Image
    help: "kiwi-server with its web pages; the major tag follows kiwi-server's releases."
    default: ghcr.io/derlocke-ng/kiwi-server-control:2
  - key: control_hostname
    label: Hostname
    help: "Empty: control.<hostname>."
    default: ""
  - key: status_page
    type: bool
    label: Status page
    help: "A page without a login at status.<hostname>: which services work, for everyone who may reach this machine's web pages. It shows no addresses and no settings."
    default: true
  - key: status_hostname
    label: Status page's hostname
    help: "Empty: status.<hostname>."
    default: ""
  - key: brand_name
    label: The network's name
    help: "On the pages for the Internet (public_status_hostname), e.g. dlhost. The pages on the VPN say Kiwi, as the control page does."
    default: ""
  - key: brand_accent
    label: Its colour
    help: "A colour for buttons and links, like #2f7d4a. Empty: Kiwi's green."
    default: ""
    pattern: '(#[0-9a-fA-F]{6})?'
  - key: about
    type: text
    label: A few words about it
    help: "On the front page for strangers: who runs these services and for whom, in a sentence or two."
    default: ""
  - key: contact
    label: How to reach you
    help: "On the front page for strangers, e.g. a Jabber address or an email address. Empty: none."
    default: ""
  - key: public_status_hostname
    label: Public status page's name
    help: "A name that points at the master in DNS, like status.example.org, with reverse-proxy: public: true on this machine. Strangers then see whether the services that are open to the Internet work, and what was wrong with them in the last week: nothing about the machines, and nothing about what is on the VPN only. Empty: no such page."
    default: ""
    pattern: '[a-z0-9.-]*'
  - key: status_minutes
    type: int
    label: Look every (minutes)
    help: "How often it asks every machine how it is doing."
    default: 10
  - key: ram_mb
    type: int
    label: RAM for the open store (MiB)
    help: "The most the folder in memory may grow to: the opened secrets, job logs, rendered stacks, and the install media made on the page (about 1 GB each, until they are fetched). Memory is only used by what is in it."
    default: 2048
  - key: play_page
    type: bool
    label: Game page
    help: "A page at play.<hostname> where people with an account of the network (the accounts module) start, stop and wake the game servers and read their logs, without being admins. Only members of the group below get in. Then: kiwi-server accounts <fleet> connect <this machine> control, and add people with kiwi-server accounts <fleet> member games <name>."
    default: false
  - key: play_hostname
    label: Game page's hostname
    help: "Empty: play.<hostname>. On the VPN only, unless it is a public name with reverse-proxy: public: true."
    default: ""
  - key: play_group
    label: Who may use the game page
    help: "The group of the network's accounts whose members get in. Made when missing."
    default: games
    pattern: '[a-z][a-z0-9_-]{1,31}'
  - key: play_extra
    type: list
    label: More containers on the game page
    help: "Containers besides the game servers that the game page lists, as machine/container, e.g. papaya/kn-jellyfin. Only containers of a machine's stack (kn-…, km-…)."
    default: []
  - key: allow_from
    label: Also allow
    help: "One more address or network that may open the page besides the mesh, e.g. the operator's LAN 192.168.0.0/16. Empty: the mesh only."
    default: ""
