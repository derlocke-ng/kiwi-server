# kiwi-server stack for sh3.home (node) — modules: vpn-client, reverse-proxy, cloud, vault, portainer
# Generated; edit the fleet file and render again instead of this file.
services:
  kn-vpn-client:
    image: docker.io/qmcgaw/gluetun:v3
    container_name: kn-vpn-client
    cap_add:
    - NET_ADMIN
    devices:
    - /dev/net/tun:/dev/net/tun
    environment:
    - VPN_SERVICE_PROVIDER=custom
    - VPN_TYPE=wireguard
    - TZ=Europe/Berlin
    - WIREGUARD_MTU=1412
    - WIREGUARD_PERSISTENT_KEEPALIVE_INTERVAL=25s
    - DOT_PROVIDERS=quad9
    - BLOCK_MALICIOUS=off
    - FIREWALL_VPN_INPUT_PORTS=80,443
    networks:
      knet-node:
        ipv4_address: 172.128.0.2
    sysctls:
    - net.ipv4.tcp_mtu_probing=1
    - net.ipv4.tcp_base_mss=1024
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
    volumes:
    - /home/user/docker/kn-vpn-client/post-rules.txt:/iptables/post-rules.txt:z
    - /home/user/docker/kn-vpn-client/wg0.conf:/gluetun/wireguard/wg0.conf:z
    extra_hosts:
    - sh3.home:172.128.0.5
    - cloud.sh3.home:172.128.0.5
    - vault.sh3.home:172.128.0.5
    - portainer.sh3.home:172.128.0.5
  kn-nginx:
    image: docker.io/library/nginx:1
    container_name: kn-nginx
    networks:
      knet-node:
        ipv4_address: 172.128.0.5
    ports:
    - 80:80
    - 443:443
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
    volumes:
    - /home/user/docker/kn-nginx/nginx.conf:/etc/nginx/nginx.conf:ro,z
    - /home/user/docker/kn-nginx/fullchain.pem:/etc/nginx/fullchain.pem:ro,z
    - /home/user/docker/kn-nginx/privkey.pem:/etc/nginx/privkey.pem:ro,z
    extra_hosts:
    - sh3.home:172.128.0.5
    - cloud.sh3.home:172.128.0.5
    - vault.sh3.home:172.128.0.5
    - portainer.sh3.home:172.128.0.5
  nextcloud-aio-apache:
    image: ghcr.io/nextcloud-releases/aio-apache:latest
    container_name: nextcloud-aio-apache
    init: true
    restart: unless-stopped
    read_only: true
    user: '33'
    cap_drop:
    - NET_RAW
    tmpfs:
    - /run
    - /usr/local/apache2/logs
    - /tmp
    - /home/www-data
    networks:
      knet-node:
        ipv4_address: 172.128.0.6
    depends_on:
    - nextcloud-aio-nextcloud
    - nextcloud-aio-notify-push
    - nextcloud-aio-collabora
    - nextcloud-aio-talk
    environment:
    - NC_DOMAIN=cloud.sh3.home
    - NEXTCLOUD_HOST=nextcloud-aio-nextcloud
    - APACHE_HOST=nextcloud-aio-apache
    - COLLABORA_HOST=nextcloud-aio-collabora
    - TALK_HOST=nextcloud-aio-talk
    - APACHE_PORT=11000
    - AIO_LOG_LEVEL=warn
    - ONLYOFFICE_HOST=nextcloud-aio-onlyoffice
    - EUROOFFICE_HOST=nextcloud-aio-eurooffice
    - TZ=Europe/Berlin
    - APACHE_MAX_SIZE=1073741824
    - APACHE_MAX_TIME=360000
    - NOTIFY_PUSH_HOST=nextcloud-aio-notify-push
    - WHITEBOARD_HOST=nextcloud-aio-whiteboard
    - HARP_HOST=nextcloud-aio-harp
    volumes:
    - nextcloud_aio_nextcloud:/var/www/html:ro
    - nextcloud_aio_apache:/mnt/data:rw
    healthcheck:
      test: /healthcheck.sh
      interval: 30s
      timeout: 30s
      start_period: 0s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
    extra_hosts:
    - sh3.home:172.128.0.5
    - cloud.sh3.home:172.128.0.5
    - vault.sh3.home:172.128.0.5
    - portainer.sh3.home:172.128.0.5
