schema_version: "1.0"

module:
  name: paperless
  title: Paperless-ngx
  version: 1.0.0
  description: "Paperless-ngx, scanned documents with OCR and full-text search, behind the reverse proxy at paperless.<hostname>"
  category: productivity
  node_types: [node]

dependencies:
  required: [vpn-client, reverse-proxy]
  optional: []

network:
  needs_vpn_dnat: true
  open_ports: []

firewall:
  scope: vpn-client
  rules: []

templates:
  compose: docker-compose.yml.j2

derived:
  paperless_host: "{{ paperless_domain or 'paperless.' ~ hostname }}"
  store_path: "{{ store_dir or docker_dir ~ '/' ~ container_prefix ~ '-paperless' }}"
  consume_path: "{{ consume_dir or store_path ~ '/consume' }}"

storage:
  volumes: [paperless_db, paperless_redis]
  bind_mounts:
    - { host: "{{ store_path }}/data", type: dir, required: true }
    - { host: "{{ store_path }}/media", type: dir, required: true }
    - { host: "{{ store_path }}/export", type: dir, required: true }
    - { host: "{{ consume_path }}", type: dir, required: true }

urls:
  - "Paperless-ngx: https://{{ paperless_host }} — user admin, the paperless.admin_password setting"

logins:
  - label: Documents (Paperless)
    user: admin
    password: admin_password
    note: "This password was set when Paperless first started. If someone changed it inside Paperless, the new one is not known here."

nginx:
  upstream:
    name: paperless
    server: "{{ container_prefix }}-paperless:8000"
  server_name: "{{ paperless_host }}"
  proxy_pass: "http://paperless"
  websocket: true
  client_max_body_size: "0"
  proxy_read_timeout: 300s
  comment: Paperless-ngx
  # no-referrer makes a browser send "Origin: null" with a form, and Django's CSRF check refuses that
  referrer_policy: same-origin

backup:
  frozen:
    containers: ["{{ container_prefix }}-paperless-db"]
    volumes: [paperless_db]
  paths: ["{{ store_path }}/data", "{{ store_path }}/media"]
  exclude: ["{{ store_path }}/data/log"]

settings:
  - key: paperless_domain
    label: Name
    help: "Empty: paperless.<hostname>."
    default: ""
    pattern: '[a-z0-9.-]*'
  - key: admin_password
    type: secret
    generate: true
    label: Admin password
    help: "The password of the Paperless user `admin`, set on the first start. Empty: generated from the seed."
  - key: ocr_language
    label: OCR language
    help: "The language of most documents, e.g. deu or deu+eng. The image has English, German, Italian, Spanish and French."
    default: eng
    pattern: '[a-z_]+(\+[a-z_]+)*'
  - key: store_dir
    label: Storage directory
    help: "Where documents and the search index live, e.g. a big disk mounted at /mnt/data/paperless. Empty: under the stack directory."
    default: ""
  - key: consume_dir
    label: Consume folder
    help: "Files put here are imported and removed: point a scanner or a share at it. Empty: consume under the storage directory."
    default: ""
  - key: office_documents
    type: bool
    label: Office documents and email
    help: "Word, Excel and .eml files, through Tika and Gotenberg: two more containers."
    default: true
  - key: filename_format
    label: File names
    help: "How stored documents are named and sorted, e.g. {{created_year}}/{{correspondent}}/{{title}}. Empty: numbered files. Documents already stored keep their names until document_renamer runs in the container."
    default: ""
  - key: user_id
    type: int
    group: Advanced
    label: User and group ID
    help: "Paperless runs as this ID and owns its folders with it. 33 lets it share a folder with Nextcloud on this host (cloud.shared_folders)."
    default: 1000
  - key: secret_key
    type: secret
    generate: true
    rotate: restart
    group: Generated
    help: "Signs Paperless's login sessions; a new one signs everybody out. Empty: generated from the fleet's seed."
  - key: db_password
    type: secret
    generate: true
    rotate:
      in: paperless-db
      run: psql -v ON_ERROR_STOP=1 -U paperless -d paperless -c "ALTER USER paperless WITH PASSWORD '$NEW'"
    group: Generated
    help: "The password of Paperless's database, used only between its containers. Empty: generated from the fleet's seed."
  - key: extra_env
    type: map
    group: Advanced
    label: Extra environment variables
    help: KEY=value, passed to Paperless as they are.
    default: {}
  - key: image
    group: Advanced
    help: "The container image of Paperless, pinned by tag. Change it to try another version or to pin a newer one. The default, latest, follows each new release."
    default: ghcr.io/paperless-ngx/paperless-ngx:latest
  - key: db_image
    group: Advanced
    help: "The container image of Paperless's database, PostgreSQL, pinned by tag. Change it to try another version or to pin a newer one. A new PostgreSQL major version cannot open the old one's data."
    default: docker.io/library/postgres:18
  - key: redis_image
    group: Advanced
    help: "The container image of Paperless's task queue, Valkey (a Redis), pinned by tag. Change it to try another version or to pin a newer one."
    default: docker.io/valkey/valkey:9-alpine
  - key: gotenberg_image
    group: Advanced
    help: "The container image of Gotenberg, which turns office documents and email into PDF, pinned by tag. Change it to try another version or to pin a newer one. Only with office_documents."
    default: docker.io/gotenberg/gotenberg:8.38
  - key: tika_image
    group: Advanced
    help: "The container image of Tika, which reads the text of office documents and email, pinned by tag. Change it to try another version or to pin a newer one. Only with office_documents."
    default: docker.io/apache/tika:3.3.1.0
