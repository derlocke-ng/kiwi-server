schema_version: "1.0"

module:
  name: vpn-client
  title: VPN connection
  version: 1.1.0
  description: "gluetun — the tunnel every node hangs off: to the master (custom WireGuard config) or to a commercial VPN (the master's exit)"
  category: core

dependencies:
  required: []
  optional: []

network:
  needs_vpn_dnat: false
  # nothing inbound on the host; DNAT'd mesh traffic arrives through the tunnel
  open_ports: []

firewall:
  # its own rules live in post-rules.txt; other modules' vpn-client rules are
  # collected into that file by the renderer (module_rules)
  scope: self
  rules: []

env:
  optional:
    DOT_PROVIDERS: "quad9"

validate:
  - when: "vpn_type == 'wireguard' and vpn_provider == 'custom' and not wireguard_config_present and not (wireguard_private_key and wireguard_addresses and wireguard_public_key and wireguard_endpoint_ip and vpn_endpoint_port)"
    error: "provider custom needs wireguard_config (the client config the master's wg-easy issued — `kiwi-server enroll <host>` fetches it into secrets/<hostname>.conf, where it is picked up by itself), or for another provider's WireGuard: wireguard_private_key, wireguard_addresses, wireguard_public_key, wireguard_endpoint_ip and vpn_endpoint_port from its config"
  - when: "vpn_type == 'wireguard' and vpn_provider != 'custom' and not wireguard_private_key"
    error: "provider {{ vpn_provider }} needs wireguard_private_key: the PrivateKey line of a WireGuard config from the provider's account page"
  - when: "vpn_type == 'wireguard' and vpn_provider in ['mullvad', 'surfshark', 'airvpn', 'windscribe', 'ivpn', 'fastestvpn'] and not wireguard_addresses"
    error: "provider {{ vpn_provider }} needs wireguard_addresses: the Address line (its IPv4 part) of the same WireGuard config"
  - when: "vpn_type == 'wireguard' and vpn_provider in ['airvpn', 'windscribe'] and not wireguard_preshared_key"
    error: "provider {{ vpn_provider }} needs wireguard_preshared_key: the PresharedKey line of the same WireGuard config"

templates:
  compose: docker-compose.yml.j2
  post_rules: post-rules.txt.j2

outputs:
  post_rules: { path: "{{ container_prefix }}-vpn-client/post-rules.txt", mode: 0644 }
  wireguard_config: { path: "{{ container_prefix }}-vpn-client/wg0.conf", mode: 0600 }

storage:
  bind_mounts:
    - { host: "${DOCKERDIR}/{{ container_prefix }}-vpn-client", type: dir, required: true }

host_integration:
  kernel_modules: [tun]

settings:
  - key: vpn_provider
    label: Provider
    help: "custom = a WireGuard config file (a node joining the master); or a gluetun provider name — mullvad, protonvpn, airvpn, ivpn, windscribe, … (the master's exit)."
    default: custom
  - key: keepalive
    type: int
    label: Keepalive (seconds)
    help: "How often the tunnel says it is there. A restarted master knows where a node is only from its next one. 0: 10 for a master of the fleet (custom), 25 for a provider."
    default: 0
  - key: vpn_type
    type: enum
    options: [wireguard, openvpn]
    help: "wireguard for a custom config and most providers. openvpn only for a provider without WireGuard; its login then goes in extra_env (OPENVPN_USER, OPENVPN_PASSWORD)."
    default: wireguard
  - key: wireguard_config
    type: file
    label: WireGuard config file
    help: "For provider custom: the client config issued by the master's wg-easy — it holds the private key and endpoint. Embedded into the role script. Empty: secrets/<hostname>.conf when that exists, which is where `kiwi-server enroll <host>` puts it."
    placeholder: secrets/sh3.home.conf
    fallback_file: "secrets/{hostname}.conf"
  - key: wireguard_private_key
    type: secret
    label: WireGuard private key
    help: "For a VPN provider: the PrivateKey line of a WireGuard config from its account page. Every provider gluetun knows with WireGuard: mullvad, protonvpn, nordvpn, surfshark, airvpn, windscribe, ivpn, fastestvpn; any other through custom."
  - key: wireguard_addresses
    label: WireGuard addresses
    help: "The Address line of the same config, its IPv4 part, e.g. 10.66.1.2/32. Not needed for protonvpn and nordvpn."
  - key: wireguard_preshared_key
    type: secret
    label: WireGuard preshared key
    help: "The PresharedKey line of the same config: airvpn and windscribe need it; custom when its config has one."
  - key: wireguard_public_key
    group: Advanced
    label: Server public key
    help: "Provider custom with another provider's config: the PublicKey line of its [Peer] part."
  - key: wireguard_endpoint_ip
    group: Advanced
    label: Server address
    help: "Provider custom with another provider's config: the address of its Endpoint line (an IP address, not a name), e.g. 185.65.135.1. Its port goes in Endpoint port."
  - key: server_countries
    label: Server countries
    help: "VPN providers: which country the exit is in, e.g. Germany. Comma separated."
  - key: server_regions
    label: Server regions
    help: "VPN providers that sort their servers by region (windscribe, protonvpn, nordvpn, surfshark, airvpn): e.g. Sweden. Comma separated."
  - key: server_cities
    label: Server cities
    help: "VPN providers: narrow it to cities, e.g. Frankfurt. Comma separated."
  - key: server_hostnames
    group: Advanced
    label: Server names
    help: "VPN providers: exactly these servers, e.g. de-fra-wg-001. Comma separated."
  - key: vpn_endpoint_port
    group: Advanced
    type: int
    label: Endpoint port
    help: "VPN providers: the WireGuard endpoint port if the provider needs one (0 = provider default). Provider custom with another provider's config: the port of its Endpoint line."
    default: 0
  - key: dot_providers
    label: DNS-over-TLS provider
    help: "gluetun resolves through DNS-over-TLS to this provider (quad9, cloudflare, google, …). On a master this is where the whole network's lookups end up, through the exit tunnel."
    default: quad9
  - key: vpn_input_ports
    group: Advanced
    label: Ports allowed in from the tunnel
    help: "Comma separated. Ports 80 and 443 are added automatically when a module is reachable at the mesh address."
    default: ""
  - key: outbound_subnets
    group: Advanced
    label: LAN subnets reachable from the tunnel namespace
    help: "Comma separated, e.g. 192.168.2.0/24 — lets the containers that share this network namespace (downloads) reach your LAN."
    default: ""
  - key: published_ports
    group: Advanced
    type: list
    label: Published host ports
    help: "host:container pairs published on the VPN client (so on the services sharing its namespace), e.g. 3129:3129."
    default: []
  - key: extra_dnat_rules
    group: Advanced
    type: list
    label: Extra DNAT rules
    help: "port/proto:destination[:port] — forwards mesh traffic for the node's mesh address, e.g. 2224/tcp:172.128.0.251:22; a range as 27000-27100/udp:172.128.0.200 (the ports stay as they are). The reverse proxy's 80/443 are automatic."
    default: []
  - key: mesh_ssh
    type: bool
    label: SSH over the mesh
    help: "On a node: port 22 of its mesh address goes to the machine's sshd, so the control node and admin devices reach it from anywhere in the VPN, also when its LAN address changes. Keys only, as everywhere. Not on a master (its sshd is on the host)."
    default: true
  - key: ssh_port
    type: int
    label: The host's SSH port
    help: "Where mesh SSH ends on the machine; follows admin.ssh_port."
    default: 22
  - key: mss_clamp
    type: bool
    label: Clamp TCP MSS to the tunnel
    help: "Sets the MSS of every TCP connection forwarded through the VPN client to wg_mtu - 40, both ways, so no segment is bigger than the tunnel carries. On by default on a master (its role) and on a node with the gateway module: LAN clients routed through it advertise MSS 1460."
    default: false
  - key: extra_env
    type: map
    group: Advanced
    label: Extra environment variables
    help: KEY=value, passed to the container as they are.
    default: {}
  - key: image
    group: Advanced
    help: "The container image this module runs, pinned by tag. Change it to try another version or to pin a newer one."
    default: docker.io/qmcgaw/gluetun:v3
