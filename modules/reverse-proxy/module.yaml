schema_version: "1.0"

module:
  name: reverse-proxy
  title: Reverse proxy (nginx)
  version: 1.1.0
  description: "nginx with TLS — one server block per service the other modules announce; certificates from the fleet CA unless you bring your own. On a master it lives inside the WireGuard server's network namespace: the admin pages get names, reachable from the mesh only"
  category: core
  node_types: [master, node]

dependencies:
  required: []
  optional: [vpn-client, cloud, vault, downloader, dns, portainer]

network:
  listen_ports: ["80/tcp", "443/tcp"]
  needs_vpn_dnat: false
  # on the host only with an address of its own; inside the WireGuard server's
  # namespace (a master) it answers on the mesh address and nothing is published
  open_ports:
    - "{% if not network_mode or public_names or (exposed or {}).get('names') %}80/tcp 443/tcp{% endif %}"
    # what the master hands on to a node besides web sites (Jabber's ports, say)
    - "{% for p in (exposed or {}).get('ports', []) %}{{ p.port }}/{{ p.proto or 'tcp' }} {% endfor %}"

firewall:
  scope: vpn-client
  rules:
    # a node's public sites: what the master hands on arrives at the mesh address on 8443, from the master only
    - "{% if via and public_names %}-t nat -A PREROUTING -s {{ via }} -d {{ vpn_ip }} -p tcp --dport 8443 -j DNAT --to-destination {{ proxy_ip }}:8443{% endif %}"

validate:
  - { when: "public and not network_mode and not via", error: "reverse-proxy.public on a node needs a master that hands its public names on: kiwi-server sets that up in a fleet with a master (via)" }
  - { when: "module_config.get('onion', {}).get('tls') and not onion_fullchain_present", error: "onion.tls needs a certificate for the .onion addresses: kiwi-server issues one from the fleet's CA (reverse-proxy.onion_fullchain, onion_privkey)" }
  - { when: "public and not public_names", error: "reverse-proxy.public: no site has a name outside the fleet's domain (hub_domain, relay_domain)" }

templates:
  compose: docker-compose.yml.j2
  nginx: nginx.conf.j2
  nginx_start: start.sh.j2
  acme_script: acme.sh.j2
  acme_service: acme.service.j2
  acme_timer: acme.timer.j2
  logs_service: nginx-logs.service.j2
  logs_timer: nginx-logs.timer.j2

outputs:
  nginx: { path: "{{ container_prefix }}-nginx/nginx.conf", mode: 0644 }
  tls_fullchain: { path: "{{ container_prefix }}-nginx/fullchain.pem", mode: 0644 }
  tls_privkey: { path: "{{ container_prefix }}-nginx/privkey.pem", mode: 0600 }
  onion_fullchain: { path: "{{ container_prefix }}-nginx/onion-fullchain.pem", mode: 0644 }
  onion_privkey: { path: "{{ container_prefix }}-nginx/onion-privkey.pem", mode: 0600 }
  nginx_start: { path: "{{ container_prefix }}-nginx/start.sh", mode: 0755, when: public_names }
  acme_script: { path: "kiwi/acme.sh", mode: 0755, when: public_names }
  acme_service: { kind: host_unit, name: "{{ container_prefix }}-acme.service", when: public_names }
  logs_service: { kind: host_unit, name: "{{ container_prefix }}-nginx-logs.service", when: public_names }
  logs_timer: { kind: host_unit, name: "{{ container_prefix }}-nginx-logs.timer", when: public_names }
  acme_timer: { kind: host_unit, name: "{{ container_prefix }}-acme.timer", when: public_names }

storage:
  bind_mounts:
    - { host: "${DOCKERDIR}/{{ container_prefix }}-nginx", type: dir, required: true }
    - { host: "${DOCKERDIR}/{{ container_prefix }}-nginx/acme", type: dir, required: true, when: public_names }
    - { host: "${DOCKERDIR}/{{ container_prefix }}-nginx/www", type: dir, required: true, when: public_names }
    - { host: "${DOCKERDIR}/{{ container_prefix }}-nginx/log", type: dir, required: true, when: public_names }
    - { host: "${DOCKERDIR}/{{ container_prefix }}-nginx/letsencrypt", type: dir, required: true, when: public_names }

nginx:
  aggregator: true

backup:
  # a public site's certificates and its ACME account: asking again is limited to a few a week
  paths: ["{% if public_names %}${DOCKERDIR}/{{ container_prefix }}-nginx/letsencrypt{% endif %}", "{% if public_names %}${DOCKERDIR}/{{ container_prefix }}-nginx/acme{% endif %}"]

settings:
  - key: federation
    type: object
    group: Generated
    label: Federation access
    help: "Filled in by kiwi-server from federation.yaml: which partner addresses may open which of this machine's names (names: name -> allow, deny), and the partner networks shut out of the rest (deny)."
    default: {}
  - key: access
    type: object
    group: Generated
    label: VPN group access
    help: "Filled in by kiwi-server from the VPN server's groups: the client ranges that reach this machine for some of its services only, and the ones without the admin pages. names: name -> the ranges refused there; others: the ranges refused at every other name."
    default: {}
  - key: exposed
    type: object
    group: Generated
    label: Handed on to nodes
    help: "Filled in by kiwi-server on a master, from the nodes whose proxy is open to the internet. names: public name -> the node's mesh address (the connection goes there still encrypted; the node holds the certificate). ports: port, to (address:port on the node), proxy_protocol."
    default: {}
  - key: via
    group: Generated
    label: The master that hands on
    help: "Filled in by kiwi-server on a node whose proxy is open to the internet: the master's mesh address. The node's public sites answer it on port 8443 and learn each visitor's address from it."
    default: ""
  - key: onion
    type: object
    group: Generated
    label: Hidden service addresses
    help: "Filled in by kiwi-server for a machine with the onion module: site name -> its .onion address. Each gets one more server on port 8043, which only the stack reaches."
    default: {}
  - key: network_mode
    label: Share a container's network
    help: "Empty: own address, ports 80 and 443 published on the host (a node). vpn-server: inside the WireGuard server's network stack, reachable at the server's mesh address only (a master): wg.<hostname>, pihole.<hostname>."
    default: ""
  - key: tls_fullchain
    type: file
    label: TLS certificate chain (fullchain.pem)
    help: "For <hostname> and *.<hostname>. Empty: issued by the fleet CA at render time (kiwi-server ca)."
  - key: tls_privkey
    type: file
    label: TLS private key (privkey.pem)
    help: "The key of that certificate chain: give both or neither. Empty: issued with the chain by the fleet CA at render time."
  - key: onion_fullchain
    type: file
    group: Generated
    label: Certificate chain for the hidden services
    help: "Filled in by kiwi-server when the onion module's tls is on: one certificate of the fleet's CA for this machine's .onion addresses. Each hidden service then answers https too."
  - key: onion_privkey
    type: file
    group: Generated
    label: Its private key
    help: "The key of that certificate chain: both or neither."
  - key: hsts
    type: bool
    label: Send HSTS headers
    help: "On: browsers are told to reach these sites over HTTPS only, for half a year, subdomains included. A site that decides this itself, as Nextcloud's does, keeps its own choice."
    default: true
  - key: rate_limit
    type: int
    label: Requests per second from one address
    help: "For sites that strangers reach (a public name, a hidden service): how many requests a second one address may send, with four times that at once for a page that loads many files. Who asks faster gets an error, and on a master with fail2ban is banned when it goes on. A hidden service's visitors all look like one address, so there the limit is three times this for the whole site. Sites of the VPN are not limited. 0: no limit."
    default: 20
  - key: public
    type: bool
    label: Open to the internet
    help: "A site whose name is outside the fleet's domain (a module's public name) is public, with a certificate from Let's Encrypt; every other site, the admin pages among them, answers the mesh only. On a master: publishes 80 and 443. On a node: nothing is opened at home; the master hands the public names on to the node through the VPN, and the node holds the certificates. The names need DNS records pointing at the master."
    default: false
  - key: acme_email
    label: Email for Let's Encrypt
    help: "Told about certificates that are about to expire. Empty: no account email."
    default: ""
  - key: acme_staging
    type: bool
    group: Advanced
    label: Let's Encrypt's test service
    help: "Certificates browsers do not trust, but no rate limits: for trying this out."
    default: false
  - key: acme_image
    group: Advanced
    help: "The container image of certbot, which fetches the Let's Encrypt certificates of public names, pinned by tag. Change it to try another version or to pin a newer one. The default, latest, follows each new release."
    default: docker.io/certbot/certbot:latest
  - key: image
    group: Advanced
    help: "The container image this module runs, pinned by tag. Change it to try another version or to pin a newer one."
    default: docker.io/library/nginx:1
