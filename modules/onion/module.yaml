schema_version: "1.0"

module:
  name: onion
  title: Hidden services (Tor)
  version: 1.0.0
  description: "Sites of this machine as Tor hidden services, for people who are not on the VPN. Tor leaves through the VPN client, never through the machine's own connection"
  category: security
  node_types: [master, node]

dependencies:
  required: [reverse-proxy]
  optional: [vpn-client, vpn-server]

network:
  needs_vpn_dnat: false
  open_ports: []

firewall:
  scope: self
  rules: []

templates:
  compose: docker-compose.yml.j2
  torrc: torrc.j2
  start_script: start.sh.j2

outputs:
  torrc: { path: "{{ container_prefix }}-onion/etc/torrc", mode: 0644 }
  start_script: { path: "{{ container_prefix }}-onion/etc/start.sh", mode: 0700 }

storage:
  bind_mounts:
    - { host: "${DOCKERDIR}/{{ container_prefix }}-onion/etc", type: dir, required: true }
    - { host: "${DOCKERDIR}/{{ container_prefix }}-onion/var", type: dir, required: true }

urls:
  - "Hidden services: {% for name, k in keys.items() %}{{ name }}.{{ hostname }} is http://{{ k.address }}{{ ' (named keys only)' if k.clients else '' }}{{ ', ' if not loop.last }}{% else %}none yet (kiwi-server onion){% endfor %}"

settings:
  - key: services
    type: object
    label: Hidden services
    help: |
      Which sites of this machine are hidden services. YAML: service -> {clients: [names]}, the service as in its address (git for git.<hostname>).
      No clients: anyone with the address gets in. With clients: only who holds one of their keys (kiwi-server onion shows them).
      round: 2 (3, …) gives the service a new address and the old one stops working (kiwi-server onion --new-address does it, as does New address on the page and in the app).
    default: {}
  - key: tls
    type: bool
    label: Answer https too
    help: "On: each hidden service also answers at https://<address>, with a certificate of the fleet's CA for the address. Tor encrypts the way to this machine by itself, so this adds little for a stranger, whose browser does not know your CA and warns. It is for programs that insist on https, and for your own people, who have the CA."
    default: false
  - key: without_vpn
    type: bool
    label: Tor without a VPN
    help: "Off (the default): Tor only through a VPN, the mesh's or a commercial VPN's, so your internet provider never sees Tor traffic; a machine without a VPN client then runs no hidden service. On: on a machine without a VPN client, Tor leaves through the machine's own connection: it works without any VPN, and your internet provider can see that you use Tor."
    default: false
  - key: keys
    type: object
    group: Generated
    label: Keys and addresses
    help: "Filled in by kiwi-server from the fleet's seed: service -> its address, its key files (secret, public) and the public keys of its named clients (clients: name -> key)."
    default: {}
  - key: image
    group: Advanced
    help: "The container image this module runs."
    default: docker.io/dockurr/tor
