schema_version: "1.0"

module:
  name: immich
  title: Photos (Immich)
  version: 1.2.0
  description: "Immich, photos and videos from your phone, behind the reverse proxy at immich.<hostname>"
  category: productivity
  node_types: [node]

dependencies:
  required: [vpn-client, reverse-proxy]
  optional: []

network:
  needs_vpn_dnat: true
  open_ports: []

firewall:
  scope: vpn-client
  rules: []

templates:
  compose: docker-compose.yml.j2
  accounts_script: immich-accounts.sh.j2
  accounts_env: immich-accounts.env.j2
  accounts_service: kn-immich-accounts.service.j2

outputs:
  # the network's accounts sign people in here (kiwi-server accounts connect): set in Immich's own settings
  accounts_script: { path: "kiwi/immich-accounts.sh", mode: 0700, when: accounts_client }
  accounts_env: { path: "kiwi/immich-accounts.env", mode: 0600, when: accounts_client }
  accounts_service: { kind: host_unit, name: kn-immich-accounts.service, when: accounts_client }

derived:
  immich_host: "{{ immich_domain or 'immich.' ~ hostname }}"
  library_path: "{{ library_dir or docker_dir ~ '/' ~ container_prefix ~ '-immich/library' }}"

storage:
  volumes: [immich_db, immich_model_cache]
  bind_mounts:
    - { host: "{{ library_path }}", type: dir, required: true }
    - { each: external_dirs, type: dir }

urls:
  - "Immich: https://{{ immich_host }} — the first person to sign up becomes the admin"

logins:
  - label: Photos (Immich)
    note: "The first person to open it makes the admin account. The network keeps no password for it."

# how this part is named on the network: the setting that holds its name, and its own word.
# By default it is immich.<machine>.<domain>; kiwi-server can name it immich.<domain> and keeps
# its name when the part moves to another machine.
named_by: { setting: immich_domain, word: immich }

nginx:
  upstream:
    name: immich
    server: "{{ container_prefix }}-immich:2283"
  server_name: "{{ immich_host }}"
  # its name on the VPN stays, and sends the browser on to the name it was given
  alias: "{{ 'immich.' ~ hostname if immich_domain else '' }}"
  # usable as a hidden service: its page, its files, what its app is told and its login's answer were tried through Tor
  onion: true
  proxy_pass: "http://immich"
  websocket: true
  client_max_body_size: "0"
  proxy_read_timeout: 600s
  comment: Immich

backup:
  frozen:
    containers: ["{{ container_prefix }}-immich-db"]
    volumes: [immich_db]
  paths: ["{{ library_path }}"]
  # made again from the originals
  exclude: ["{{ library_path }}/thumbs", "{{ library_path }}/encoded-video"]

fail2ban:
  - name: immich
    container: "{{ container_prefix }}-immich"
    match: "Failed login attempt for user"
    failregex: 'Failed login attempt for user .* from ip address <HOST>'

settings:
  - key: immich_domain
    label: Name
    help: "Empty: immich.<hostname>."
    default: ""
    pattern: '[a-z0-9.-]*'
  - key: library_dir
    label: Library directory
    help: "Where photos and videos live, e.g. a big disk mounted at /mnt/data/immich. Empty: under the stack directory."
    default: ""
  - key: external_dirs
    type: list
    label: Folders with photos already on this host
    help: "Immich reads them and never changes them, e.g. a folder Nextcloud holds. Each one appears inside Immich at the same path: an admin adds that path as an import path of an External Library. Moving a photo there counts as a delete and a new file, and loses what Immich knows about it."
    default: []
    pattern: '/[A-Za-z0-9._/-]+'
  - key: machine_learning
    type: bool
    label: Machine learning
    help: "Face recognition and search by content. Its container wants a few GB of memory; off, the rest of Immich still works."
    default: true
  - key: db_password
    type: secret
    generate: true
    rotate:
      in: immich-db
      run: psql -v ON_ERROR_STOP=1 -U immich -d immich -c "ALTER USER immich WITH PASSWORD '$NEW'"
    group: Generated
    help: "The password of Immich's database, used only between its containers. Empty: generated from the fleet's seed."
  - key: accounts_client
    group: Generated
    help: "Set by kiwi-server when the network's accounts sign people in here (kiwi-server accounts <fleet> connect <host> immich): the client's name in Kanidm."
    default: ""
  - key: accounts_issuer
    group: Generated
    help: "Set by kiwi-server with accounts_client: where Immich asks Kanidm about the person signing in."
    default: ""
  - key: accounts_secret
    type: secret
    group: Generated
    help: "Set by kiwi-server with accounts_client: the client's secret, from the fleet's store."
    default: ""
  - key: extra_env
    type: map
    group: Advanced
    label: Extra environment variables
    help: KEY=value, passed to the server as they are.
    default: {}
  - key: image
    group: Advanced
    help: "The container image of the Immich server, pinned by tag. Change it to try another version or to pin a newer one."
    default: ghcr.io/immich-app/immich-server:v3
  - key: ml_image
    group: Advanced
    help: "The container image of Immich's machine learning, pinned by tag. Change it to try another version or to pin a newer one. Keep it at the same version as the server."
    default: ghcr.io/immich-app/immich-machine-learning:v3
  - key: db_image
    group: Advanced
    help: "The container image of Immich's database, its own PostgreSQL build, pinned by tag. Change it to try another version or to pin a newer one. A new PostgreSQL major version cannot open the old one's data."
    default: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
  - key: redis_image
    group: Advanced
    help: "The container image of Immich's job queue, Valkey (a Redis), pinned by tag. Change it to try another version or to pin a newer one."
    default: docker.io/valkey/valkey:9
