schema_version: "1.0"

module:
  name: sftp
  title: SFTP access
  version: 1.0.0
  description: "An SFTP server on its own port for fetching downloads from the LAN or the mesh"
  category: storage
  node_types: [node]

dependencies:
  required: []
  optional: [downloader]

network:
  needs_vpn_dnat: false
  open_ports: ["{{ sftp_port }}/tcp"]

firewall:
  scope: vpn-client
  rules:
    - "-t nat -A PREROUTING -d ${VPN_IP} -p tcp --dport {{ sftp_port }} -j DNAT --to-destination {{ container_ip }}:22"

templates:
  compose: docker-compose.yml.j2
  users: users.conf.j2

outputs:
  users: { path: "{{ container_prefix }}-sftp/users.conf", mode: 0600 }

storage:
  bind_mounts:
    - { host: "{{ sftp_dir or module_config.get('downloader', {}).get('download_dir') or docker_dir ~ '/sftp' }}", type: dir, required: true }

urls:
  - "SFTP: sftp -P {{ sftp_port }} {{ sftp_user }}@{{ hostname }}"

logins:
  - label: File transfer (SFTP)
    address: "sftp://{{ hostname }}:{{ sftp_port }}"
    user: "{{ sftp_user }}"
    password: sftp_password
    note: "Not a web page. Open the address in a file manager, or in an SFTP program such as FileZilla."

backup:
  # only a folder of its own: without sftp_dir it serves the downloads
  paths: ["{{ sftp_dir }}"]

settings:
  - key: sftp_user
    help: "The login name; the shared directory is Downloads in its home."
    default: user
  - key: sftp_password
    type: secret
    generate: true
    rotate: restart
    help: "Empty: generated from the fleet's seed."
  - key: sftp_uid
    type: int
    help: Must own the shared directory (the downloader's puid when sharing its downloads).
    default: 1000
  - key: sftp_port
    type: int
    help: "The host port SFTP answers on, e.g. sftp -P 2224 user@<hostname>. Not 22, which the host's own ssh uses."
    default: 2224
  - key: sftp_dir
    label: Shared directory
    help: "Empty: the download station's directory, or <stack directory>/sftp."
    default: ""
  - key: image
    group: Advanced
    help: atmoz/sftp or a fork of it (jmcombs/sftp adds arm64) — both read /etc/sftp/users.conf.
    default: docker.io/jmcombs/sftp
