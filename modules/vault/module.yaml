schema_version: "1.0"

module:
  name: vault
  title: Vaultwarden
  version: 1.1.0
  description: "Vaultwarden — the Bitwarden-compatible password manager, behind the reverse proxy"
  category: security
  node_types: [node]

dependencies:
  required: [vpn-client, reverse-proxy]
  optional: []

network:
  needs_vpn_dnat: true
  open_ports: []

firewall:
  scope: vpn-client
  rules: []

templates:
  compose: docker-compose.yml.j2

storage:
  bind_mounts:
    - { host: "${DOCKERDIR}/{{ container_prefix }}-vault", type: dir, required: true }

urls:
  - "Vaultwarden: {{ vault_domain or 'https://vault.' ~ hostname }}"

nginx:
  upstream:
    name: vaultwarden
    server: "{{ container_prefix }}-vault:80"
  server_name: "{{ (vault_domain or 'https://vault.' ~ hostname) | replace('https://', '') | replace('http://', '') }}"
  proxy_pass: "http://vaultwarden"
  websocket: true
  comment: Vaultwarden

backup:
  frozen:
    containers: ["{{ container_prefix }}-vault"]
    paths: ["${DOCKERDIR}/{{ container_prefix }}-vault"]

settings:
  - key: vault_domain
    label: URL
    help: "The full URL clients use. Empty: https://vault.<hostname>."
    default: ""
  - key: signups_allowed
    type: bool
    label: Allow signups
    help: Turn on for the first account, then off again; invitations keep working.
    default: false
  - key: invitations_allowed
    type: bool
    help: "On: an organization's admins may invite people by email address, who can then register although signups are off. Off: nobody new joins while signups are off."
    default: true
  - key: show_password_hint
    type: bool
    help: "On: without a mail server, the hint to an account's master password is shown on the page to anyone who asks with the account's email address. Off: it stays hidden."
    default: false
  - key: log_level
    type: enum
    options: [error, warn, info, debug]
    help: "How much Vaultwarden writes to its log, from error (least) to debug (most)."
    default: warn
  - key: admin_token
    type: secret
    label: Admin panel token
    help: "Empty: the /admin panel stays off."
    default: ""
  - key: extra_env
    type: map
    group: Advanced
    label: Extra environment variables
    help: KEY=value, passed to the container as they are.
    default: {}
  - key: image
    group: Advanced
    help: "The container image this module runs, pinned by tag. Change it to try another version or to pin a newer one. The default, latest-alpine, follows each new release."
    default: docker.io/vaultwarden/server:latest-alpine
