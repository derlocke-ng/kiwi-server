schema_version: "1.0"

module:
  name: nostr-relay
  title: Nostr relay (strfry)
  version: 1.1.0
  description: "strfry, a nostr relay, behind the reverse proxy at relay.<hostname>: the relay a hub built on kiwi-framework keeps its events on. Reachable through the mesh (TLS from the fleet CA); public when the host publishes 443 under a public name with a certificate for it"
  category: network
  node_types: [master]

dependencies:
  required: [reverse-proxy]
  optional: [vpn-client]

network:
  listen_ports: ["7777/tcp"]
  needs_vpn_dnat: true
  open_ports: []

firewall:
  scope: vpn-client
  rules: []

templates:
  compose: docker-compose.yml.j2
  strfry_conf: strfry.conf.j2
  write_policy: write-policy.py.j2

outputs:
  strfry_conf: { path: "{{ container_prefix }}-nostr-relay/strfry.conf", mode: 0644 }
  write_policy: { path: "{{ container_prefix }}-nostr-relay/write-policy.py", mode: 0755, when: writes_restricted }

validate:
  - { when: "register_pow < 0 or register_pow > 40", error: "nostr-relay.register_pow: 0 to 40 bits" }
  - { when: "write_pubkeys | map('length') | reject('equalto', 64) | list", error: "nostr-relay.write_pubkeys: 64 hex characters each, not npub1..." }

storage:
  bind_mounts:
    - { host: "${DOCKERDIR}/{{ container_prefix }}-nostr-relay", type: dir, required: true }
    - { host: "${DOCKERDIR}/{{ container_prefix }}-nostr-relay/db", type: dir, required: true }

derived:
  relay_host: "{{ relay_domain or 'relay.' ~ hostname }}"
  writes_restricted: "{{ '' if open_writes else 'yes' }}"

urls:
  - "Nostr relay: wss://{{ relay_host }}"

nginx:
  upstream:
    name: strfry
    server: "{{ container_prefix }}-nostr-relay:7777"
  server_name: "{{ relay_host }}"
  proxy_pass: "http://strfry"
  websocket: true
  proxy_read_timeout: 86400s
  client_max_body_size: "1m"
  comment: Nostr relay (strfry)

backup:
  frozen:
    containers: ["{{ container_prefix }}-nostr-relay"]
    paths: ["${DOCKERDIR}/{{ container_prefix }}-nostr-relay/db"]

settings:
  - key: relay_domain
    label: Name
    help: "The name clients connect to, wss://<name>. Empty: relay.<hostname>, a mesh name (the fleet's DNS resolves it, the fleet CA signs it). A public relay is a public name here, the host's 443 reachable from the internet, and a certificate for the name under reverse-proxy."
    default: ""
    pattern: '[a-z0-9.-]*'
  - key: write_pubkeys
    type: list
    label: Admins
    help: "Public keys, 64 hex characters each. They may always post, and only their lists of members and bans count. Anyone may read."
    default: []
  - key: members
    type: enum
    label: Who may post from the internet
    help: "After proving their key (NIP-42). approved: the keys on the list an admin signs; an account alone can only read. registered: anyone with an account on this hub, made with proof of work against spam. The mesh may always post."
    options: [approved, registered]
    default: approved
  - key: open_writes
    type: bool
    group: Advanced
    label: Anyone may post
    help: "No limit on who posts. On a public relay that means strangers can fill the disk."
    default: false
  - key: relay_name
    label: Relay name (NIP-11)
    help: "Shown by clients. Empty: the host's name."
    default: ""
  - key: relay_description
    type: text
    label: Description (NIP-11)
    help: "A few words about the relay that clients show with its name."
    default: "A Kiwi Network relay."
  - key: relay_pubkey
    label: Operator pubkey (NIP-11, hex)
    help: "The public key of whoever runs the relay, 64 hex characters, shown by clients as its operator. Empty: none."
    default: ""
    pattern: '([0-9a-f]{64})?'
  - key: relay_contact
    label: Contact (NIP-11)
    help: "How to reach whoever runs the relay, e.g. an email address or a URL, shown by clients. Empty: none."
    default: ""
  - key: max_event_bytes
    type: int
    group: Limits
    label: Largest event (bytes)
    help: "kiwi-framework's sealed events stay well under 256 KiB; photos go to a media server, not the relay."
    default: 262144
  - key: max_filter_limit
    type: int
    group: Limits
    help: "The most events one query returns, however many a client asks for."
    default: 500
  - key: max_subs_per_connection
    type: int
    group: Limits
    help: "How many subscriptions one connection may keep open at once; a client asking for more is refused."
    default: 40
  - key: register_pow
    type: int
    group: Limits
    label: Proof of work for a new account (bits)
    help: "NIP-13, on the account entry. Each bit doubles the work a sign-up costs."
    default: 20
  - key: register_per_hour
    type: int
    group: Limits
    label: New accounts per address and hour
    help: "How many accounts one address may create within an hour; any more are refused, on top of the proof of work."
    default: 10
  - key: keep_days
    type: int
    group: Limits
    label: Oldest event accepted (days)
    help: "Events dated further back than this are refused. 0: no limit."
    default: 0
  - key: negentropy
    type: bool
    group: Advanced
    label: Negentropy sync
    help: "Lets clients and other relays sync with this relay quickly (NIP-77), fetching only the events they lack. Off: they fall back to ordinary queries."
    default: true
  - key: image
    group: Advanced
    help: "Members need this build (images/strfry): stock strfry does not tell the write policy which key a connection proved."
    default: ghcr.io/derlocke-ng/strfry:1.1.3-kiwi2
  - key: config_path
    group: Advanced
    label: Config path in the image
    help: "Where strfry in the image reads its configuration; the module's strfry.conf is mounted there. Change it only for an image that looks elsewhere."
    default: /etc/strfry.conf
  - key: db_path
    group: Advanced
    label: Database path in the image
    help: "Where strfry in the image keeps its database, which lives on the host in the stack directory. Change it only for an image that looks elsewhere."
    default: /app/strfry-db
