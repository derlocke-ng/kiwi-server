schema_version: "1.0"

module:
  name: vpn-server
  title: WireGuard server (wg-easy)
  version: 1.1.0
  description: "wg-easy — the entry point for every client and node; its default route points at the VPN client for the double hop"
  category: core
  node_types: [master]

dependencies:
  required: []
  optional: [vpn-client]

network:
  needs_vpn_dnat: false
  open_ports: ["{{ wg_port }}/udp"]

firewall:
  # applied inside the container by start.sh (WG_POST_UP)
  scope: self
  rules: []

templates:
  compose: docker-compose.yml.j2
  start_script: start.sh.j2

outputs:
  start_script: { path: "{{ container_prefix }}-vpn-server/start.sh", mode: 0755 }

storage:
  bind_mounts:
    - { host: "${DOCKERDIR}/{{ container_prefix }}-vpn-server", type: dir, required: true }

host_integration:
  kernel_modules: [wireguard]

urls:
  - "wg-easy admin: {% if has_reverse_proxy %}https://{{ wg_hostname or 'wg.' ~ hostname }} from the mesh (admin groups), or {% endif %}http://127.0.0.1:51821 on the master (ssh -L 51821:127.0.0.1:51821 {{ hostname }})"

nginx:
  servers:
    - server_name: "{{ wg_hostname or 'wg.' ~ hostname }}"
      proxy_pass: "http://{{ '127.0.0.1' if module_config.get('reverse-proxy', {}).get('network_mode') == 'vpn-server' else container_prefix ~ '-vpn-server' }}:51821"
      websocket: true
      when: has_reverse_proxy
      comment: wg-easy (WireGuard clients)

settings:
  - key: wg_host
    required: true
    label: Public endpoint
    help: The hostname or IP clients connect to (WG_HOST).
    placeholder: vpn.example.org
  - key: wg_password
    type: secret
    required: true
    label: wg-easy admin password
    help: The web UI listens on 127.0.0.1:51821 of the master only.
  - key: wg_port
    type: int
    label: WireGuard port (UDP)
    default: 51820
  - key: public_ip
    label: Bind to this address only
    help: "Publish the WireGuard port on one host address (the live master binds its public IP). Empty: all addresses."
    default: ""
  - key: server_ip
    label: Server mesh address
    help: "The server's own address in the mesh: what clients use for DNS and Tor, and the master's mesh address for the fleet's DNS records."
    default: 10.8.0.1
  - key: wg_subnet
    label: Mesh subnet
    default: 10.8.0.0/24
  - key: wg_default_address
    label: Client address pattern
    default: 10.8.0.x
  - key: wg_hostname
    label: wg-easy page hostname
    help: "Empty: wg.<hostname>. Served by the reverse proxy when there is one, for admin groups only."
    default: ""
  - key: groups
    type: object
    label: Client groups
    help: |
      Who may reach what, by the client address range wg-easy gives them. YAML: name -> {subnet, reach, peers, internet, admin}.
      reach: what in the mesh the group may reach — all (default), nodes (every node), host names from the fleet, addresses or subnets. The server itself is always reachable (DNS).
      peers: may members reach other VPN clients (default true). internet: may they leave through the exit (default true). admin: may they open the admin pages wg.<hostname>, pihole.<hostname> and the wg-easy port (default false).
      Clients outside every group are the plain mesh: everything, admin pages as admin_from_mesh says.
    default:
      guests:  { subnet: 10.8.1.0/24, reach: [nodes], peers: false }
      pentest: { subnet: 10.8.2.0/24, reach: [], peers: false }
      devices: { subnet: 10.8.3.0/24, reach: [all], admin: true }
      routers: { subnet: 10.8.4.0/24, reach: [all] }
  - key: admin_from_mesh
    type: bool
    label: Admin pages for clients outside every group
    help: "wg-easy and Pi-hole at the server's mesh address for plain mesh clients (10.8.0.x). Off: only groups with admin: true, and ssh -L on the master."
    default: true
  - key: isolated_subnet
    group: Advanced
    label: Isolated client subnet (legacy)
    help: "The pre-groups setting: a group named isolated with reach: [nodes] + isolated_allow and peers: false. Empty: off."
    default: ""
  - key: isolated_allow
    type: list
    group: Advanced
    label: Extra addresses isolated clients may reach (legacy)
    default: []
  - key: ui_traffic_stats
    type: bool
    default: true
  - key: extra_env
    type: map
    group: Advanced
    label: Extra environment variables
    help: KEY=value, passed to the container as they are.
    default: {}
  - key: image
    group: Advanced
    help: "weejewel/wg-easy is the last line that takes WG_POST_UP and PASSWORD; ghcr.io/wg-easy/wg-easy:15 needs the INIT_* setup instead."
    default: weejewel/wg-easy
