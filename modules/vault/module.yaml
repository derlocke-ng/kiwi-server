schema_version: "1.0"

module:
  name: vault
  title: Passwords (Vaultwarden)
  version: 1.2.0
  description: "Vaultwarden — the Bitwarden-compatible password manager, behind the reverse proxy"
  category: security
  node_types: [node]

dependencies:
  required: [vpn-client, reverse-proxy]
  optional: []

network:
  needs_vpn_dnat: true
  open_ports: []

firewall:
  scope: vpn-client
  rules: []

templates:
  compose: docker-compose.yml.j2
  ca_start: ca-start.sh.j2

outputs:
  # the network's accounts sign people in here (kiwi-server accounts connect): Vaultwarden trusts the fleet's CA for it
  ca_start: { path: "{{ container_prefix }}-vault-kiwi/kiwi-start.sh", mode: 0755, when: accounts_client }

derived:
  # Vaultwarden takes ADMIN_TOKEN as the token itself or as an Argon2 hash of it ($argon2…)
  admin_token_plain: "{{ 'yes' if admin_token and not admin_token.startswith('$argon2') else '' }}"
  admin_token_hashed: "{{ 'yes' if admin_token.startswith('$argon2') else '' }}"

storage:
  bind_mounts:
    - { host: "${DOCKERDIR}/{{ container_prefix }}-vault", type: dir, required: true }

urls:
  - "Vaultwarden: {{ vault_domain or 'https://vault.' ~ hostname }}"

logins:
  - label: Passwords (Vaultwarden)
    note: "Everyone makes their own account here. The network keeps no password for it."
  - label: Vaultwarden admin page
    path: /admin
    password: admin_token
    when: admin_token_plain
    note: "The admin page asks for this token only."
  - label: Vaultwarden admin page
    path: /admin
    when: admin_token_hashed
    note: "The network keeps only a hash of this page's token. Type the password the hash was made from."

nginx:
  upstream:
    name: vaultwarden
    server: "{{ container_prefix }}-vault:80"
  server_name: "{{ (vault_domain or 'https://vault.' ~ hostname) | replace('https://', '') | replace('http://', '') }}"
  # its name on the VPN stays, and sends the browser on to the name it was given
  alias: "{{ 'vault.' ~ hostname if vault_domain else '' }}"
  proxy_pass: "http://vaultwarden"
  websocket: true
  extra_locations:
    # Vaultwarden's admin page (with admin_token): from the VPN only, for the groups with the admin pages
    - { path: "^~ /admin", admin: true, proxy: true, config: "allow {{ mesh_subnet }}; deny all;" }
  comment: Vaultwarden

backup:
  frozen:
    containers: ["{{ container_prefix }}-vault"]
    paths: ["${DOCKERDIR}/{{ container_prefix }}-vault"]

# wrong passwords and wrong admin tokens, as Vaultwarden logs them: fail2ban bans who keeps on
fail2ban:
  - name: vault
    container: "{{ container_prefix }}-vault"
    match: "Username or password is incorrect|Invalid admin token"
    failregex: '(?:Username or password is incorrect\. Try again|Invalid admin token)\. IP: <HOST>\.'

settings:
  - key: vault_domain
    label: URL
    help: "The full URL clients use. Empty: https://vault.<hostname>."
    default: ""
  - key: signups_allowed
    type: bool
    label: Allow signups
    help: Turn on for the first account, then off again; invitations keep working.
    default: false
  - key: invitations_allowed
    type: bool
    help: "On: an organization's admins may invite people by email address, who can then register although signups are off. Off: nobody new joins while signups are off."
    default: true
  - key: show_password_hint
    type: bool
    help: "On: without a mail server, the hint to an account's master password is shown on the page to anyone who asks with the account's email address. Off: it stays hidden."
    default: false
  - key: log_level
    type: enum
    options: [error, warn, info, debug]
    help: "How much Vaultwarden writes to its log, from error (least) to debug (most)."
    default: warn
  - key: admin_token
    type: secret
    label: Admin panel token
    help: "Empty: the /admin panel stays off."
    default: ""
  - key: sso_only
    type: bool
    help: "With the network's accounts connected (kiwi-server accounts <fleet> connect <host> vault): only single sign-on, no sign-in with email and master password. The master password still unlocks the vault."
    default: false
  - key: accounts_client
    group: Generated
    help: "Set by kiwi-server when the network's accounts sign people in here (kiwi-server accounts <fleet> connect <host> vault): the client's name in Kanidm."
    default: ""
  - key: accounts_issuer
    group: Generated
    help: "Set by kiwi-server with accounts_client: where Vaultwarden asks Kanidm about the person signing in."
    default: ""
  - key: accounts_secret
    type: secret
    group: Generated
    help: "Set by kiwi-server with accounts_client: the client's secret, from the fleet's store."
    default: ""
  - key: extra_env
    type: map
    group: Advanced
    label: Extra environment variables
    help: KEY=value, passed to the container as they are.
    default: {}
  - key: image
    group: Advanced
    help: "The container image this module runs, pinned by tag. Change it to try another version or to pin a newer one. The default, latest-alpine, follows each new release."
    default: docker.io/vaultwarden/server:latest-alpine
