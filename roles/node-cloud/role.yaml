# roles/node-cloud — a kiwi-node in cloud mode: the kiwi-cloud compose stack.
#
# What it does on first boot: installs docker (Debian) or enables it (uCore),
# clones kiwi-cloud into docker_dir, writes .env from these settings, drops the
# WireGuard config and TLS certificate in place, renders nginx.conf and the
# gluetun post-rules, and starts the stack with kiwi-node.sh — which then keeps
# itself updated through its own cron entries.
name: node-cloud
title: kiwi-node (cloud mode)
description: Nextcloud AIO, Vaultwarden, Portainer and nginx behind a gluetun WireGuard client — the kiwi-cloud stack.
status: wip
targets: [coreos, ucore, debian]
settings:
  - key: repo
    group: Stack
    label: kiwi-cloud repository
    help: Git URL of the compose stack. Replace it with your modularized kiwi-node when it is ready.
    default: https://github.com/derlocke-ng/kiwi-cloud.git
  - key: ref
    group: Stack
    label: Branch or tag
    default: main
  - key: docker_dir
    group: Stack
    label: Docker directory
    help: Where the stack lives. kiwi-node.sh hard-codes /home/user/docker, so keep this unless you change the script too.
    default: /home/user/docker
  - key: data_dir
    group: Stack
    label: Data directory
    help: Second data location (DOCKERDIR2), e.g. a big disk mounted at /mnt/data/docker. Empty means <docker dir>/data.
    default: ""
  - key: service_user
    group: Stack
    label: Service user
    help: kiwi-node.sh runs its cron jobs as this user; it is created if missing (uid 1000 when free).
    default: user
  - key: docker_source
    group: Stack
    type: enum
    options: [ce, distro]
    label: Docker packages (Debian)
    help: ce = Docker CE from download.docker.com (docker compose included), distro = Debian's docker.io.
    targets: [debian]
    default: ce

  - key: vpn_config
    group: VPN
    type: file
    required: true
    label: WireGuard client config
    help: The wg0.conf gluetun connects with (from your kiwi-master). Embedded into the role script.
    placeholder: secrets/sh3.kiwi.conf
  - key: vpn_ip
    group: VPN
    required: true
    label: VPN address
    help: This node's address inside the WireGuard network (VPN_IP), e.g. 10.8.0.25.
    placeholder: 10.8.0.25
  - key: vpn_type
    group: VPN
    type: enum
    options: [wireguard, openvpn]
    default: wireguard
  - key: vpn_mtu
    group: VPN
    type: int
    label: WireGuard MTU
    default: 1412
  - key: dot_providers
    group: VPN
    label: DNS-over-TLS providers (gluetun)
    default: google
  - key: docker_subnet
    group: VPN
    label: Docker subnet
    help: The knet-node network. Must match docker-compose-kiwi-node-cloud.yml.
    default: 172.129.0.0/24

  - key: nc_hostname
    group: Services
    label: Nextcloud hostname
    help: Empty means cloud.<hostname>.
    default: ""
  - key: nc_admin_hostname
    group: Services
    label: Nextcloud AIO admin hostname
    help: Empty means nc-admin.<hostname>.
    default: ""
  - key: vault_domain
    group: Services
    label: Vaultwarden URL
    help: Empty means https://vault.<hostname>.
    default: ""
  - key: tls_fullchain
    group: Services
    type: file
    label: TLS certificate (fullchain.pem)
    help: For *.<hostname>. Empty generates a self-signed one on first boot — replace it in <docker dir>/knnginx later.
  - key: tls_privkey
    group: Services
    type: file
    label: TLS private key (privkey.pem)
  - key: nextcloud_datadir
    group: Services
    label: Nextcloud data directory
    help: Empty means <data dir>/knnc-data. Do not change after the first start.
    default: ""
  - key: nextcloud_memory_limit
    group: Services
    default: 4096M
  - key: nextcloud_upload_limit
    group: Services
    default: 50G
  - key: nextcloud_startup_apps
    group: Services
    label: Nextcloud apps installed on first start
    default: deck twofactor_totp tasks calendar contacts notes
  - key: open_firewall
    group: Services
    type: bool
    label: Open 80/443 in the host firewall
    default: true
  - key: env
    group: Services
    type: map
    label: Extra .env entries
    help: Anything else kiwi-cloud's .env understands; these win over the generated values.
    default: {}
