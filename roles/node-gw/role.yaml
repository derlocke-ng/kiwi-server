# roles/node-gw — a kiwi-node in gateway mode: the LAN's gateway (downloads and SFTP
# were in it until 0.123.2: a gateway does not need them; add the modules where wanted).
#
# LAN clients use this machine as their DNS (Pi-hole, with a DHCP relay so
# leases come from Pi-hole) and optionally as their default gateway, in which
# case policy routing sends all their traffic through the VPN client.
name: node-gw
title: kiwi-node (gateway)
description: LAN gateway through the VPN with Pi-hole and DHCP relay, nginx and Portainer. Downloads and SFTP are modules to add.
status: alias of node (preset gateway)
targets: [coreos, ucore, debian]
node_type: node
modules: [vpn-client, dns, dhcp-relay, reverse-proxy, gateway, portainer]
settings_include: [common/stack]
module_defaults:
  dns: { expose_web_ui: true }
