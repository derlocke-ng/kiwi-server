schema_version: "1.0"

module:
  name: fail2ban
  title: Ban list (fail2ban)
  version: 1.0.0
  description: "Bans addresses that keep failing to log in over SSH, and slows down any one address that opens SSH connections too fast; on a master with public sites also scanners and bad requests there. fail2ban runs on the host's network and reads sshd's log, which a small host unit copies out of the journal, and nginx's."
  category: security
  node_types: [master, node]

dependencies:
  required: []
  optional: []

network:
  needs_vpn_dnat: false
  open_ports: []

firewall:
  scope: host
  rules: []

templates:
  compose: docker-compose.yml.j2
  jail: kiwi.local.j2
  ratelimit: ratelimit.sh.j2
  log_unit: kn-sshd-log.service.j2
  probe_filter: kiwi-nginx-probe.conf.j2
  refused_filter: kiwi-nginx-refused.conf.j2
  own_script: own.sh.j2
  own_service: own.service.j2
  own_timer: own.timer.j2
  app_filter: kiwi-app.conf.j2
  apps_init: apps-init.sh.j2
  tap_script: f2b-tap.sh.j2
  tap_unit: f2b-tap.service.j2
  deny_action: kiwi-nginx-deny.conf.j2
  banned_path: nginx-banned.path.j2
  banned_service: nginx-banned.service.j2

outputs:
  jail: { path: "{{ container_prefix }}-fail2ban/config/fail2ban/jail.d/kiwi.local", mode: 0644 }
  ratelimit: { path: "{{ container_prefix }}-fail2ban/init/50-kiwi-ratelimit", mode: 0755 }
  log_unit: { kind: host_unit, name: kn-sshd-log.service }
  probe_filter: { path: "{{ container_prefix }}-fail2ban/config/fail2ban/filter.d/kiwi-nginx-probe.conf", mode: 0644 }
  refused_filter: { path: "{{ container_prefix }}-fail2ban/config/fail2ban/filter.d/kiwi-nginx-refused.conf", mode: 0644 }
  # on a master, and on the nodes it hands visitors on to: the addresses the network's own machines come from are never banned
  own_script: { path: "kiwi/fail2ban-own.sh", mode: 0755, when: f2b_own }
  own_service: { kind: host_unit, name: kn-fail2ban-own.service, when: f2b_own }
  own_timer: { kind: host_unit, name: kn-fail2ban-own.timer, when: f2b_own }
  # the apps' wrong logins (module.yaml fail2ban: of every module here), on a machine with public sites
  app_filter: { path: "{{ container_prefix }}-fail2ban/config/fail2ban/filter.d/kiwi-app.conf", mode: 0644, when: f2b_tap }
  apps_init: { path: "{{ container_prefix }}-fail2ban/init/51-kiwi-files", mode: 0755 }
  tap_script: { path: "kiwi/f2b-tap.sh", mode: 0755, when: f2b_tap }
  tap_unit: { kind: host_unit, name: kn-f2b-tap.service, when: f2b_tap }
  # behind the master: a ban is a line in nginx's list, which nginx reads again when it changes
  deny_action: { path: "{{ container_prefix }}-fail2ban/config/fail2ban/action.d/kiwi-nginx-deny.conf", mode: 0644, when: f2b_behind }
  banned_path: { kind: host_unit, name: kn-nginx-banned.path, when: f2b_behind }
  banned_service: { kind: host_unit, name: kn-nginx-banned.service, when: f2b_behind }

derived:
  # public sites here, and whether they come through the master (only nginx knows the visitor then)
  f2b_web: "{{ 'yes' if has_reverse_proxy and (module_config.get('reverse-proxy') or {}).get('public') else '' }}"
  f2b_behind: "{{ 'yes' if has_reverse_proxy and (module_config.get('reverse-proxy') or {}).get('public') and (module_config.get('reverse-proxy') or {}).get('via') else '' }}"
  f2b_own: "{{ 'yes' if has_vpn_server or f2b_behind else '' }}"
  f2b_tap: "{{ 'yes' if f2b_jails and has_reverse_proxy and (module_config.get('reverse-proxy') or {}).get('public') else '' }}"

storage:
  bind_mounts:
    - { host: "${DOCKERDIR}/{{ container_prefix }}-fail2ban/config", type: dir }
    - { host: "${DOCKERDIR}/{{ container_prefix }}-fail2ban/apps", type: dir }
    - { host: "/var/log/kiwi", type: dir }

settings:
  - key: ssh_port
    type: int
    label: SSH port
    help: "The port sshd listens on: what the jail and the rate limit watch. kiwi-server sets it from admin.ssh_port."
    default: 22
  - key: maxretry
    type: int
    label: Failures before a ban
    help: "Failed logins from one address within findtime before it is banned."
    default: 5
  - key: findtime
    label: Within
    help: "The window the failures are counted in, e.g. 10m or 1h."
    default: "10m"
  - key: bantime
    label: Ban for
    help: "How long a banned address stays out, e.g. 1h or 1d. -1: for good."
    default: "1h"
  - key: ratelimit
    type: int
    label: New SSH connections per minute
    help: "Per address; more are dropped. Generous enough for kiwi-server's own bursts. 0: no limit."
    default: 20
  - key: ignore
    type: list
    label: Never banned
    help: "Addresses or networks that are never banned, e.g. your home's public address. The mesh is never banned."
    default: []
  - key: image
    group: Advanced
    help: "The container image this module runs, pinned by tag. Change it to try another version or to pin a newer one."
    default: docker.io/linuxserver/fail2ban:1.1.0
